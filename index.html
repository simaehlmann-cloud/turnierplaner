function drawFits(x){
  const act = x.teams.filter(e => e.act).map(e => e.id).sort().join();
  if(x.cfg.mode === 'ko' || x.cfg.mode === 'kids') return x.seeds.slice().sort().join() === act;
  if(x.cfg.mode === 'league') return x.groups.length === 1 && x.groups[0].ids.slice().sort().join() === act;
  const exp = Math.max(1, Math.min(x.cfg.gCount, Math.floor(x.teams.filter(e => e.act).length / 2) || 1));
  return x.groups.length === exp && x.groups.every(g => g.n) && [].concat(...x.groups.map(g => g.ids)).sort().join() === act;
}
function doDraw(x){ const d = Engine.draw(x.teams, x.cfg); x.groups = d.groups; x.seeds = d.seeds; DSEL = null; }
function buildNow(x){
  const err = Engine.validate(x);
  if(err){ toast(errText(err)); return false; }
  Engine.build(x);
  DB.lastCfg = JSON.parse(JSON.stringify(x.cfg));
  save();
  STACK = [{ v: 'home' }, { v: 'tour', id: x.id, tab: 'plan' }];
  closeSheet(); render(true);
  toast(T().planCreated);
  return true;
}
function moveTeam(x, id, zone, beforeId){
  if(x.cfg.mode === 'ko' || x.cfg.mode === 'kids'){
    const list = x.seeds.filter(s => s !== id);
    const i = beforeId ? list.indexOf(beforeId) : -1;
    list.splice(i < 0 ? list.length : i, 0, id);
    x.seeds = list;
  } else {
    const gi = parseInt(String(zone).slice(1), 10);
    if(!(gi >= 0 && x.groups[gi])) return;
    x.groups.forEach(g => { g.ids = g.ids.filter(s => s !== id); });
    const list = x.groups[gi].ids;
    const i = beforeId ? list.indexOf(beforeId) : -1;
    list.splice(i < 0 ? list.length : i, 0, id);
  }
  save();
}
function swapTeams(x, a, b){
  if(x.cfg.mode === 'ko' || x.cfg.mode === 'kids'){
    const i = x.seeds.indexOf(a), j = x.seeds.indexOf(b);
    if(i >= 0 && j >= 0){ x.seeds[i] = b; x.seeds[j] = a; }
  } else {
    let pa = null, pb = null;
    x.groups.forEach((g, gi) => { const i = g.ids.indexOf(a), j = g.ids.indexOf(b); if(i >= 0) pa = [gi, i]; if(j >= 0) pb = [gi, j]; });
    if(pa && pb){ x.groups[pa[0]].ids[pa[1]] = b; x.groups[pb[0]].ids[pb[1]] = a; }
  }
  save();
}
function parseList(text){
  const out = [];
  String(text || '').split(/\r?\n|;/).forEach(line => {
    let s = line.replace(/^[\s\-•*]+/, '').trim();
    if(!s) return;
    let nr = null, m;
    if((m = /^(\d{1,3})[.):\s]+(.+)$/.exec(s))){ nr = +m[1]; s = m[2]; }
    else if((m = /^(.+?)[,\s]+#?(\d{1,3})$/.exec(s))){ nr = +m[2]; s = m[1]; }
    s = s.replace(/[,\t]+/g, ' ').trim();
    if(s) out.push({ id: uid(), name: s.slice(0, 40), nr });
  });
  return out;
}

/* =====================================================================
   PDF (offline): jede Seite wird auf einem Canvas gezeichnet und als
   JPEG in eine schlanke PDF-Datei gelegt. Keine Bibliothek noetig.
   ===================================================================== */
const A4 = { w: 595.28, h: 841.89, pw: 1654, ph: 2339 };   // Punkte bzw. Pixel bei 200 dpi
function dataUrlBytes(d){ return base64ToBytes(String(d).split(',')[1] || ''); }
function canvasPage(cv){ return { jpg: dataUrlBytes(cv.toDataURL('image/jpeg', 0.9)), w: cv.width, h: cv.height }; }
function makePdf(pages, wPt, hPt){
  const enc = new TextEncoder(), parts = [], offs = [];
  let len = 0;
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : x; parts.push(b); len += b.length; };
  const begin = n => { offs[n] = len; push(n + ' 0 obj\n'); };
  push('%PDF-1.4\n%âãÏÓ\n');
  const N = pages.length;
  begin(1); push('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  begin(2); push('<< /Type /Pages /Kids [' + pages.map((_, i) => (3 + i * 3) + ' 0 R').join(' ') + '] /Count ' + N + ' >>\nendobj\n');
  pages.forEach((p, i) => {
    const pn = 3 + i * 3, im = pn + 1, ct = pn + 2;
    begin(pn); push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + wPt + ' ' + hPt + '] /Resources << /XObject << /Im0 ' + im + ' 0 R >> >> /Contents ' + ct + ' 0 R >>\nendobj\n');
    begin(im); push('<< /Type /XObject /Subtype /Image /Width ' + p.w + ' /Height ' + p.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + p.jpg.length + ' >>\nstream\n');
    push(p.jpg); push('\nendstream\nendobj\n');
    const c = 'q ' + wPt + ' 0 0 ' + hPt + ' 0 0 cm /Im0 Do Q';
    begin(ct); push('<< /Length ' + c.length + ' >>\nstream\n' + c + '\nendstream\nendobj\n');
  });
  const xref = len, total = 3 + N * 3;
  let x = 'xref\n0 ' + total + '\n0000000000 65535 f \n';
  for(let n = 1; n < total; n++) x += String(offs[n]).padStart(10, '0') + ' 00000 n \n';
  push(x + 'trailer\n<< /Size ' + total + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');
  return new Blob(parts, { type: 'application/pdf' });
}
const pause0 = () => new Promise(r => setTimeout(r, 0));
function loadImage(src){
  return new Promise(res => { if(!src){ res(null); return; } const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
}
function drawContain(cx, im, x, y, w, h){
  const k = Math.min(w / im.naturalWidth, h / im.naturalHeight), dw = im.naturalWidth * k, dh = im.naturalHeight * k;
  cx.drawImage(im, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
  return dh;
}
function drawCover(cx, im, x, y, w, h){
  const k = Math.max(w / im.naturalWidth, h / im.naturalHeight), sw = w / k, sh = h / k;
  cx.drawImage(im, (im.naturalWidth - sw) / 2, (im.naturalHeight - sh) / 2, sw, sh, x, y, w, h);
}
const SANS = 'system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
const SERIF = 'Georgia,"Times New Roman",serif';
function fitFont(cx, text, maxW, size, weight, fam){
  let s = size;
  cx.font = weight + ' ' + s + 'px ' + fam;
  while(s > 20 && cx.measureText(text).width > maxW){ s -= 4; cx.font = weight + ' ' + s + 'px ' + fam; }
  return s;
}
function wrapLines(cx, text, maxW, maxLines){
  const words = String(text).split(/\s+/).filter(Boolean), lines = [];
  let line = '';
  words.forEach(w => {
    const tst = line ? line + ' ' + w : w;
    if(cx.measureText(tst).width > maxW && line){ lines.push(line); line = w; } else line = tst;
  });
  if(line) lines.push(line);
  return lines.slice(0, maxLines || 3);
}

/* =====================================================================
   URKUNDEN
   Platzhalter in allen Texten: {{TEAM}} {{PLATZ}} {{TURNIER}} {{DATUM}}
   {{SPIELER}} {{VEREIN}} {{ORT}} (englisch auch TEAM, PLACE, TOURNAMENT,
   DATE, PLAYER, CLUB, CITY)
   ===================================================================== */
const PH_ALIAS = { PLACE: 'PLATZ', TOURNAMENT: 'TURNIER', DATE: 'DATUM', PLAYER: 'SPIELER', CLUB: 'VEREIN', CITY: 'ORT' };
const PH_KEYS = ['TEAM', 'PLATZ', 'TURNIER', 'DATUM', 'SPIELER', 'VEREIN', 'ORT'].concat(Object.keys(PH_ALIAS));
function phVal(d, k){ k = k.toUpperCase(); k = PH_ALIAS[k] || k; return d[k] != null ? String(d[k]) : ''; }
const fillPh = (s, d) => String(s || '').replace(/\{\{\s*([A-Za-zÄÖÜäöü]+)\s*\}\}/g, (m, k) => PH_KEYS.indexOf(k.toUpperCase()) !== -1 ? phVal(d, k) : m).replace(/\s+/g, ' ').trim();
function certTexts(type){ return Object.assign({}, T().certDef[type], DB.prefs.cert.texts[type] || {}); }
const sigLabel = n => { const v = DB.prefs.cert['sig' + n]; return v == null ? T()['certSigDef' + n] : v; };
/* Datensaetze fuer die Urkunden eines Turniers */
function certList(x, type, upTo){
  const t = T(), A = ana(x), P = DB.prefs.cert;
  const base = { TURNIER: x.name, DATUM: fmtDate(x.date), ORT: P.place || '' };
  const club = id => { const e = entry(x, id), g = e && e.ref ? teamById(id) : null; return (g ? g.club : e && e.club) || ''; };
  const hide = kidsQuick(x);
  const posOf = {};
  if(!hide) A.rank.forEach(r => { posOf[r.id] = r.pos; });
  const mk = (id, extra) => Object.assign({}, base, { TEAM: tname(x, id), VEREIN: club(id), teamId: id, SPIELER: '',
    PLATZ: posOf[id] && !hide ? t.placeLbl(posOf[id]) : t.participation }, extra || {});
  if(type === 'place'){
    if(hide) return [];
    return A.rank.filter(r => r.pos <= upTo).map(r => mk(r.id, { PLATZ: t.placeLbl(r.pos), pos: r.pos }));
  }
  const teams = x.teams.filter(e => e.act).map(e => e.id);
  const order = hide ? teams.slice().sort((a, b) => tname(x, a).localeCompare(tname(x, b))) :
    A.rank.map(r => r.id).filter(id => teams.indexOf(id) !== -1).concat(teams.filter(id => !posOf[id]));
  if(type === 'team') return order.map(id => mk(id));
  const out = [];
  order.forEach(id => playersOf(x, id).forEach(p => out.push(mk(id, { SPIELER: p.name }))));
  return out;
}

function seeded(n){ let s = n * 9301 + 49297; return () => { s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
/* Eine Urkunde zeichnen (W x H Pixel, Hochformat A4) */
function drawCert(cx, W, H, d, type, as){
  const P = DB.prefs.cert, col = P.color, design = P.design, tx = certTexts(type);

  const fam = design === 'classic' ? SERIF : SANS;
  cx.textAlign = 'center'; cx.textBaseline = 'alphabetic';
  // Hintergrund und Rahmen
  cx.fillStyle = design === 'classic' ? '#fffaf0' : '#ffffff'; cx.fillRect(0, 0, W, H);
  if(design === 'image' && as.bg) drawCover(cx, as.bg, 0, 0, W, H);
  if(design === 'classic'){
    cx.strokeStyle = col; cx.lineWidth = 22; cx.strokeRect(70, 70, W - 140, H - 140);
    cx.strokeStyle = '#c9a227'; cx.lineWidth = 6; cx.strokeRect(118, 118, W - 236, H - 236);
    cx.fillStyle = '#c9a227';
    [[118, 118], [W - 118, 118], [118, H - 118], [W - 118, H - 118]].forEach(([px, py]) => {
      cx.beginPath(); cx.moveTo(px, py - 34); cx.lineTo(px + 34, py); cx.lineTo(px, py + 34); cx.lineTo(px - 34, py); cx.closePath(); cx.fill();
    });
  } else if(design === 'kids'){
    const rnd = seeded(7), cols = ['#f44336', '#ffca28', '#42a5f5', '#66bb6a', '#ab47bc', '#ff7043'];
    for(let i = 0; i < 110; i++){
      const px = rnd() * W, py = rnd() * H;
      if(px > 200 && px < W - 200 && py > 200 && py < H - 200) continue;
      cx.fillStyle = cols[i % cols.length]; cx.save(); cx.translate(px, py); cx.rotate(rnd() * 6.28);
      if(i % 3 === 0){ cx.beginPath(); cx.arc(0, 0, 10 + rnd() * 16, 0, 6.28); cx.fill(); }
      else cx.fillRect(-14, -6, 28 + rnd() * 20, 12);
      cx.restore();
    }
    cx.strokeStyle = col; cx.lineWidth = 26;
    cx.beginPath(); if(cx.roundRect) cx.roundRect(60, 60, W - 120, H - 120, 90); else cx.rect(60, 60, W - 120, H - 120); cx.stroke();
  } else if(design === 'school'){
    cx.fillStyle = col; cx.fillRect(0, 0, W, 150); cx.fillRect(0, H - 40, W, 40);
  }
  const maxW = W - 360;
  let y = design === 'school' ? 230 : 230;
  if(as.logo){ drawContain(cx, as.logo, (W - 300) / 2, y, 300, 220); y += 250; }
  // Titel
  cx.fillStyle = design === 'image' ? ink : col;
  const title = fillPh(tx.title, d);
  if(title){ const s = fitFont(cx, title, maxW, 190, 900, fam); cx.fillText(title, W / 2, y + s * 0.85); y += s * 1.15; }
  if(design === 'school'){ cx.fillStyle = col; cx.fillRect(160, y, W - 320, 4); y += 20; }
  // Mittelteil als Stapel; Hoehe vorher messen, dann je nach Lage setzen
  const items = [];
  const textItem = (txt, size, weight, color, lines) => {
    txt = fillPh(txt, d); if(!txt) return;

    const ls = wrapLines(cx, txt, maxW, lines || 3);
    items.push({ h: ls.length * size * 1.3, draw: yy => { cx.font = weight + ' ' + size + 'px ' + fam; cx.fillStyle = color; ls.forEach((l, i) => cx.fillText(l, W / 2, yy + size * (1.05 + i * 1.3))); } });
  };
  const bigItem = (txt, size, color) => {
    txt = fillPh(txt, d); if(!txt) return;
    const s = fitFont(cx, txt, maxW, size, 900, fam);
    items.push({ h: s * 1.3, draw: yy => { cx.font = '900 ' + s + 'px ' + fam; cx.fillStyle = color; cx.fillText(txt, W / 2, yy + s * 1.05); } });
  };
  textItem(tx.top, 58, 500, ink, 3);
  const tl = as.teamLogo[d.teamId];

/* ----- Word-Vorlagen (.docx) -----
   Die App fuellt Platzhalter in einer Word-Datei aus und haengt pro Urkunde
   eine Seite an. Ergebnis ist wieder eine .docx (zum Drucken aus Word/Pages). */
const DOCX_MIME = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
const xmlEsc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[c]));
function sampleDocx(){
  const L = T().docx;
  const run = (txt, sz, bold, color) => '<w:r><w:rPr><w:rFonts w:ascii="Arial" w:hAnsi="Arial" w:cs="Arial"/>' + (bold ? '<w:b/>' : '') +
    (color ? '<w:color w:val="' + color + '"/>' : '') + '<w:sz w:val="' + sz * 2 + '"/></w:rPr><w:t xml:space="preserve">' + xmlEsc(txt) + '</w:t></w:r>';
  const p = (txt, sz, bold, color, after) => '<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="' + (after || 160) + '"/></w:pPr>' + run(txt, sz, bold, color) + '</w:p>';
  const tabs = '<w:pPr><w:tabs><w:tab w:val="center" w:pos="2300"/><w:tab w:val="center" w:pos="7300"/></w:tabs><w:spacing w:after="0"/></w:pPr>';
  const body = p(L.title, 60, true, '1F6B2A', 480) + p(L.top, 16) + p('{{TURNIER}}', 24, true) + p(L.on + ' {{DATUM}}', 16, false, null, 720) +
    p('{{PLATZ}}', 40, true, '1F6B2A', 240) + p('{{TEAM}}', 32, true) + p('{{SPIELER}}', 24, false, null, 600) + p(L.bottom, 16, false, null, 2400) +
    '<w:p>' + tabs + '<w:r><w:tab/></w:r>' + run('{{ORT}} {{DATUM}}', 12) + '</w:p>' +
    '<w:p>' + tabs + '<w:r><w:tab/></w:r>' + run('______________________', 12) + '<w:r><w:tab/></w:r>' + run('______________________', 12) + '</w:p>' +
    '<w:p>' + tabs + '<w:r><w:tab/></w:r>' + run(L.sig1, 11) + '<w:r><w:tab/></w:r>' + run(L.sig2, 11) + '</w:p>';
  const sect = '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1418" w:right="1134" w:bottom="1134" w:left="1134" w:header="709" w:footer="709" w:gutter="0"/></w:sectPr>';
  const doc = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' + body + sect + '</w:body></w:document>';
  const ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>';
  const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  const u = fflate.strToU8;
  return fflate.zipSync({ '[Content_Types].xml': u(ct), '_rels/.rels': u(rels), 'word/document.xml': u(doc) });
}
/* Platzhalter finden, auch wenn Word ihn in mehrere Textstuecke zerlegt hat
   ({{TE</w:t></w:r><w:r><w:t>AM}}). Die Tags dazwischen sind immer ein
   schliessender und ein oeffnender Teil – beim Ersetzen bleibt das XML gueltig. */
const PH_RE = {};
function phRegex(key){
  if(PH_RE[key]) return PH_RE[key];
  const G = '(?:<[^>]+>)*';
  PH_RE[key] = new RegExp('\\{' + G + '\\{' + G + key.split('').join(G) + G + '\\}' + G + '\\}', 'gi');
  return PH_RE[key];
}
function fillXml(xml, d){ PH_KEYS.forEach(k => { xml = xml.replace(phRegex(k), xmlEsc(phVal(d, k))); }); return xml; }
function fillDocx(bytes, list){
  const files = fflate.unzipSync(bytes);
  const docName = 'word/document.xml';
  if(!files[docName]) throw new Error('nodoc');
  const doc = fflate.strFromU8(files[docName]);
  const bi = doc.indexOf('<w:body>'), be = doc.lastIndexOf('</w:body>');
  if(bi < 0 || be < 0) throw new Error('nobody');
  const inner = doc.slice(bi + 8, be);
  const si = inner.lastIndexOf('<w:sectPr');
  const content = si >= 0 && inner.indexOf('<w:p', si) === -1 ? inner.slice(0, si) : inner;
  const sect = si >= 0 && inner.indexOf('<w:p', si) === -1 ? inner.slice(si) : '';
  const brk = '<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
  const pages = list.map((d, i) => fillXml(content, d)
    .replace(/(<wp:docPr\b[^>]*\bid=")(\d+)/g, (m, a, n) => a + (+n + i * 1000))
    .replace(/(<w:bookmark(?:Start|End)\b[^>]*\bw:id=")(\d+)/g, (m, a, n) => a + (+n + i * 1000))).join(brk);
  files[docName] = fflate.strToU8(doc.slice(0, bi + 8) + pages + sect + doc.slice(be));
  Object.keys(files).forEach(n => { if(/^word\/(header|footer)\d*\.xml$/.test(n)) files[n] = fflate.strToU8(fillXml(fflate.strFromU8(files[n]), list[0])); });
  return fflate.zipSync(files);
}
async function certDocx(x, type, upTo){
  const t = T(), list = certList(x, type, upTo);
  if(!list.length){ toast(type === 'player' ? t.certNoPlayers : t.certNone); return; }
  try {
    const tpl = IMG['cert:docx'] ? dataUrlBytes(IMG['cert:docx']) : sampleDocx();
    const out = fillDocx(tpl, list);
    await saveBlob(new Blob([out], { type: DOCX_MIME }), fileName(t.certFile + '_' + x.name, '.docx'), DOCX_MIME, true);
  } catch(e){ toast(t.docxFail); }
}

/* =====================================================================
   ZEIT-ASSISTENT: welcher Modus passt in die verfuegbare Zeit?
   ===================================================================== */
function assistOptions(x, endMin){
  const t = T(), c = x.cfg, start = Engine.parseTime(c.start), avail = endMin - start;
  const n = x.teams.filter(e => e.act).length;
  if(n < 2 || avail < 10) return [];
  const cands = [{ mode: 'league', legs: 1 }, { mode: 'league', legs: 2 }];
  for(let g = 2; g <= Math.min(4, Math.floor(n / 3)); g++){
    if(g === 2) cands.push({ mode: 'groups', gCount: 2, adv: 2, best: 0, legs: 1 });
    if(g === 3){ cands.push({ mode: 'groups', gCount: 3, adv: 1, best: 1, legs: 1 }); cands.push({ mode: 'groups', gCount: 3, adv: 2, best: 2, legs: 1 }); }
    if(g === 4){ cands.push({ mode: 'groups', gCount: 4, adv: 1, best: 0, legs: 1 }); cands.push({ mode: 'groups', gCount: 4, adv: 2, best: 0, legs: 1 }); }
  }
  cands.push({ mode: 'ko' });
  const out = [];
  cands.forEach(p => {
    const cfg = Object.assign({}, c, p, { dur: 10, koDur: 10, seed: 'manual' });
    const clone = { cfg, teams: x.teams, groups: [], seeds: [], matches: [] };
    const d = Engine.draw(x.teams, cfg); clone.groups = d.groups; clone.seeds = d.seeds;
    if(Engine.validate(clone)) return;
    Engine.build(clone);
    const S = Engine.slotCount(clone), hasKo = clone.matches.some(m => m.ph === 'ko') && p.mode === 'groups';
    const dur = Math.floor((avail - (S - 1) * c.brk - (hasKo ? c.koPause : 0)) / S);
    if(dur < 3) return;
    const D = Math.min(dur, 30);
    const used = S * D + (S - 1) * c.brk + (hasKo ? c.koPause : 0);
    out.push({ p: Object.assign({}, p, { dur: D, koDur: D }), label: assistLabel(p, clone), matches: clone.matches.length, slots: S, dur: D, end: start + used });
  });
  // Kindermodus: Runden statt Modus
  const kd = Math.max(5, Math.min(12, c.mode === 'kids' ? c.dur : 7));
  const kr = Math.floor((avail + c.brk) / (kd + c.brk));
  if(kr >= 2) out.push({ p: { mode: 'kids', kRounds: Math.min(40, kr), dur: kd }, label: t.modeKids + ' · ' + t.nRounds(Math.min(40, kr)), matches: Math.min(40, kr) * Engine.kidsFields(c, n), slots: Math.min(40, kr), dur: kd, end: start + kr * kd + (kr - 1) * c.brk });
  return out;
}
function assistLabel(p, clone){
  const t = T();
  if(p.mode === 'league') return t.modeLeague + (p.legs === 2 ? ' · ' + t.legs2 : '');
  if(p.mode === 'ko') return t.modeKo;
  const k = clone.matches.filter(m => m.ph === 'ko' && m.kr === 1).length;
  const first = clone.matches.find(m => m.ph === 'ko' && m.kr === 1);
  return t.nGroups(p.gCount) + ' · ' + (first ? matchLabel(first).replace(/\s*\d+$/, '') : '') + (p.best ? ' · ' + t.plusBest(p.best) : '') + (k ? '' : '');
}

/* =====================================================================
   TEAMS AUS EINER KLASSENLISTE
   Zeilen wie "Lea Beispiel w 4" – Geschlecht (m/w/d) und Staerke 1–5
   sind optional. Verteilung in Schlangenlinie: ausgeglichene Teams.
   ===================================================================== */
let CL = { n: 4, bal: true, mix: true, prefix: '', text: '', res: null };
function parseClassList(text){
  return String(text || '').split(/\r?\n/).map(line => {
    const tk = line.replace(/[;,\t]+/g, ' ').trim().split(/\s+/).filter(Boolean);
    if(!tk.length) return null;
    let str = null, g = null;
    for(let k = 0; k < 2 && tk.length > 1; k++){
      const last = tk[tk.length - 1];
      if(/^[1-5]$/.test(last) && str == null){ str = +last; tk.pop(); continue; }
      if(/^(m|w|d|j|f)$/i.test(last) && g == null){ g = last.toLowerCase() === 'j' ? 'm' : last.toLowerCase() === 'f' ? 'w' : last.toLowerCase(); tk.pop(); continue; }
    }
    const name = tk.join(' ').slice(0, 40);
    return name ? { name, str: str || 3, g } : null;
  }).filter(Boolean);
}
function makeClassTeams(list, n, bal, mix){
  const shuffled = list.slice().sort(() => Math.random() - 0.5);
  const groups = {};
  shuffled.forEach(p => { const k = mix && p.g ? p.g : '_'; (groups[k] = groups[k] || []).push(p); });
  const teams = Array.from({ length: n }, () => []);
  let idx = 0, dir = 1;
  Object.keys(groups).sort().forEach(k => {
    const g = groups[k];
    if(bal) g.sort((a, b) => b.str - a.str);
    g.forEach(p => {
      teams[idx].push(p);
      idx += dir;
      if(idx >= n){ idx = n - 1; dir = -1; } else if(idx < 0){ idx = 0; dir = 1; }
    });
  });
  return teams;
}

let BEAM = { i: 0, at: 0 };
function beamerPanels(x, A){
  const t = T(), c = x.cfg, p = [];
  if(c.mode === 'kids'){ if(!c.kHide) p.push({ title: t.ladderTitle, html: '<div class="card">' + tableHtml(x, A.tables[0], 0, A, true) + '</div>' }); }
  else if(c.mode !== 'ko') x.groups.forEach((g, gi) => p.push({ title: groupName(x, gi), html: '<div class="card">' + tableHtml(x, A.tables[gi], gi, A, true) + '</div>' }));
  const ko = x.matches.filter(m => m.ph === 'ko');
  if(ko.length) p.push({ title: c.mode === 'ko' ? t.bracket : t.finalRound, html: '<div class="slot">' + ko.slice().sort((a, b) => a.slot - b.slot || a.f - b.f).map(m => matchRowHtml(x, m, A)).join('') + '</div>' });
  if(A.stats && A.stats.scorers.length && !kidsQuick(x)) p.push({ title: t.scorers, html: scorersHtml(x, A, 8) });
  const k = beamSlot(x, A), times = Engine.slotTimes(x);
  const nxt = x.matches.filter(m => m.slot === k + 1);
  if(nxt.length) p.push({ title: t.nextUp + ' · ' + Engine.fmtTime(times[k + 1].start), html: '<div class="slot">' + nxt.map(m => matchRowHtml(x, m, A)).join('') + '</div>' });
  return p;
}
function beamSlot(x, A){ return x.clock ? x.clock.s : Math.max(0, currentSlot(x, A)); }
function viewBeamer(r){
  const t = T(), x = tourById(r.id), A = ana(x), times = Engine.slotTimes(x);
  const k = beamSlot(x, A);
  const ms = x.matches.filter(m => m.slot === k).sort((a, b) => a.f - b.f);
  const panels = beamerPanels(x, A);
  const pnl = panels.length ? panels[BEAM.i % panels.length] : null;
  let h = '<div class="bm-head"><div><div class="bm-name">' + esc(x.name) + '</div><div class="bm-sub">' + esc(slotTitle(x, k, A) + ' · ' + Engine.fmtTime(times[k] ? times[k].start : 0)) + '</div></div>' +
    '<div id="bclk" class="num">--:--</div><button class="bm-x" data-act="back" aria-label="' + esc(t.close) + '">✕</button></div>';
  h += '<div class="bm-grid"><div>' + sec(t.matchesNow) + '<div class="slot">' + (ms.length ? ms.map(m => matchRowHtml(x, m, A)).join('') : '<div class="empty" style="padding:14px">' + esc(t.kidsLater) + '</div>') + '</div></div>' +
    '<div>' + (pnl ? sec(pnl.title) + pnl.html : '') + '</div></div>';
  return h;
}

function importSquads(data){
  const t = T();
  let list = [];
  if(data && data.kind === 'squads' && Array.isArray(data.squads)) list = data.squads.map(k => ({ name: k && k.name, players: (k && k.players || []).map(p => ({ name: p && p.name, nr: p && (p.nr != null ? p.nr : p.number) })) }));
  else if(data && Array.isArray(data.teams)) list = data.teams.map(k => ({ name: k && k.name, players: (k && k.players || []).map(p => ({ name: p && p.name, nr: p && (p.nr != null ? p.nr : p.number) })) }));
  list = list.filter(k => str(k.name, 50));
  if(!list.length){ toast(t.squadImportErr); return; }
  let nt = 0, np = 0;
  list.forEach(k => {
    const name = str(k.name, 50);
    let tm = DB.teams.find(x => x.name.toLowerCase() === name.toLowerCase());
    if(!tm){ tm = { id: uid(), name, club: '', str: 3, players: [] }; DB.teams.push(tm); nt++; }
    k.players.forEach(p => {
      const pl = cleanPlayer({ name: p.name, nr: p.nr === '' ? null : p.nr });
      if(pl && tm.players.length < 80 && !tm.players.some(q => q.name.toLowerCase() === pl.name.toLowerCase())){ tm.players.push(pl); np++; }
    });
  });
  save(); render(false); toast(t.squadImported(nt, np));
}

let binHandler = null;
function pickBinary(accept, handler){
  let el = $('bin-in');
  if(!el){
    el = document.createElement('input'); el.type = 'file'; el.id = 'bin-in'; el.style.display = 'none'; document.body.appendChild(el);
    el.addEventListener('change', () => { const f = el.files && el.files[0], h = binHandler; binHandler = null; el.value = ''; if(f && h) h(f); });
  }
  el.accept = accept; binHandler = handler; el.click();
}
const readDataUrl = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsDataURL(f); });

Object.assign(A, {
  /* Ereignisse im Ergebnis-Blatt */
  evAdd(el){ if(!sheetCtx) return; sheetCtx.pick = { s: el.dataset.s, k: el.dataset.k, pen: false }; renderEvents(); },
  evPen(){ if(sheetCtx && sheetCtx.pick){ sheetCtx.pick.pen = !sheetCtx.pick.pen; renderEvents(); } },
  evCancel(){ if(sheetCtx){ sheetCtx.pick = null; renderEvents(); } },
  evPick(el){
    const x = curTour(), c = sheetCtx;
    if(!c || !c.pick) return;
    const m = x.matches.find(y => y.id === c.mid), tm = ana(x).teams[m.id];
    const pk = c.pick, og = el.dataset.og === '1';
    const teamId = pk.s === 'h' ? tm[0] : tm[1];
    const p = el.dataset.p ? playersOf(x, teamId).find(q => q.id === el.dataset.p) : null;
    const clk = evClock(x, m);
    const e = { id: uid(), k: og ? 'og' : pk.k === 'goal' && pk.pen ? 'pen' : pk.k, s: og ? (pk.s === 'h' ? 'a' : 'h') : pk.s, p: p ? p.id : null, n: p ? p.name : '', min: clk.min, at: pk.k === 'tp' ? clk.at : null };
    c.ev.push(e); evScoreDelta(e, 1); c.pick = null;
    vibrate(20); updateResUI(); renderEvents();
  },
  evDel(el){
    const c = sheetCtx; if(!c) return;
    const e = c.ev.find(q => q.id === el.dataset.id);
    if(!e) return;
    c.ev = c.ev.filter(q => q !== e); evScoreDelta(e, -1); updateResUI(); renderEvents();
  },
  kwSet(el){
    const x = curTour(), id = sheetCtx && sheetCtx.mid, v = el.dataset.v;
    if(!id) return;
    commit(x, y => { y.matches.find(q => q.id === id).res = { kw: v }; }, () => vibrate(25));
  },

  sndTry(el){ unlockAudio(); signal(el.dataset.k); },
  sndUp(el){
    const k = el.dataset.k;
    pickBinary('audio/*', f => {
      if(f.size > 2.5e6){ toast(T().sndTooBig); return; }
      readDataUrl(f).then(d => { if(!/^data:audio\//.test(d)) d = d.replace(/^data:[^;]*/, 'data:audio/mpeg'); return setImg('snd:' + k, d); }).then(() => { delete SND_BUF[k]; A.settings(); signal(k); });
    });
  },
  sndDel(el){ setImg('snd:' + el.dataset.k, null).then(() => A.settings()); },

/* ----- Turnier weitergeben: Datei oder QR-Code-Folge -----
   Die Datei enthaelt das Turnier samt Kadern und Wappen. Der QR-Weg
   transportiert das Turnier ohne Bilder, komprimiert und in Teile
   zerlegt ("TP3:<kennung>:<nr>/<anzahl>:<daten>"). */
function tourPacket(x, withLogos){
  const tour = JSON.parse(JSON.stringify(x));
  tour.teams = x.teams.map(e => {
    const g = e.ref ? teamById(e.id) : null;
    return Object.assign({}, e, { name: tname(x, e.id), club: g ? g.club : e.club, players: (g ? g.players : e.players || []).map(p => ({ id: p.id, name: p.name, nr: p.nr })) });
  });
  const pk = { app: 'turnierpro', kind: 'tour', v: 1, tour };
  if(withLogos){
    pk.logos = {};
    x.teams.forEach(e => { if(IMG[e.id + ':logo']) pk.logos[e.id] = IMG[e.id + ':logo']; });
  }
  return pk;
}
let PENDING_IMPORT = null;
function importTourPacket(pk){
  const t = T();
  if(!pk || pk.app !== 'turnierpro' || pk.kind !== 'tour'){ toast(t.tourImportErr); return; }
  const x = cleanTour(pk.tour);
  if(!x){ toast(t.tourImportErr); return; }
  // Teams, die es hier nicht gibt, werden zu Turnier-Teams (mit Kader)
  x.teams.forEach(e => { if(e.ref && !teamById(e.id)) e.ref = false; });
  if(pk.logos && typeof pk.logos === 'object') Object.keys(pk.logos).forEach(id => {
    const v = pk.logos[id];
    if(cleanId(id) && typeof v === 'string' && /^data:image\/(png|jpeg|webp);base64,/.test(v) && v.length < 1e6 && !IMG[id + ':logo']) setImg(id + ':logo', v);
  });
  const old = tourById(x.id);
  if(old){
    PENDING_IMPORT = x;
    openSheet(t.tourExists(old.name), t.tourExistsHint, act('importReplace', '🔄', t.importReplace, t.importReplaceHint) + act('importCopy', '⧉', t.importCopy, t.importCopyHint));
    return;
  }
  finishTourImport(x);
}
function finishTourImport(x){
  DB.tours.push(x); save();
  STACK = [{ v: 'home' }, built(x) ? { v: 'tour', id: x.id, tab: 'plan' } : { v: 'setup', id: x.id }];
  closeSheet(); render(true); toast(T().tourImported);
}
const b64url = u8 => { let s = ''; for(let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const unb64url = s => base64ToBytes(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4));
const QR_CHUNK = 650;
function qrParts(x){
  const json = JSON.stringify(tourPacket(x, false));
  const data = b64url(fflate.deflateSync(fflate.strToU8(json), { level: 9 }));
  const id = Math.random().toString(36).slice(2, 7), n = Math.max(1, Math.ceil(data.length / QR_CHUNK)), out = [];
  for(let i = 0; i < n; i++) out.push('TP3:' + id + ':' + (i + 1) + '/' + n + ':' + data.slice(i * QR_CHUNK, (i + 1) * QR_CHUNK));
  return out;
}
function qrSvg(text){
  const q = qrcode(0, 'L');
  q.addData(text, 'Byte'); q.make();
  const n = q.getModuleCount(), m = 4, size = n + 2 * m;
  let d = '';
  for(let r = 0; r < n; r++) for(let c = 0; c < n; c++) if(q.isDark(r, c)) d += 'M' + (c + m) + ' ' + (r + m) + 'h1v1h-1z';
  return '<svg viewBox="0 0 ' + size + ' ' + size + '" width="100%" style="max-width:340px;display:block;margin:0 auto;background:#fff;border-radius:12px" shape-rendering="crispEdges"><path d="' + d + '" fill="#000"/></svg>';
}
let QRSHOW = null;
function renderQrSheet(){
  const t = T(), q = QRSHOW;
  if(!q) return;
  const box = $('qr-box');
  if(!box) return;
  box.innerHTML = qrSvg(q.parts[q.i]) + '<div style="text-align:center;font-weight:900;font-size:20px;margin-top:10px">' + (q.i + 1) + ' / ' + q.parts.length + '</div>';
}
function stopQrShow(){ if(QRSHOW && QRSHOW.timer) clearInterval(QRSHOW.timer); QRSHOW = null; }

/* Scanner: Kamera live (getUserMedia) oder einzelnes Foto */
let SCAN = null;
function scanReset(){ return { id: null, n: 0, parts: {}, stream: null, raf: 0, last: 0 }; }
function scanFeed(text){
  const m = /^TP3:([a-z0-9]+):(\d+)\/(\d+):(.*)$/i.exec(String(text || '').trim());
  if(!m) return false;
  const id = m[1], i = +m[2], n = +m[3];
  if(SCAN.id && SCAN.id !== id){ SCAN.parts = {}; }
  SCAN.id = id; SCAN.n = n;
  if(!SCAN.parts[i]){ SCAN.parts[i] = m[4]; vibrate(25); }
  const got = Object.keys(SCAN.parts).length;
  const st = $('scan-st'); if(st) st.textContent = T().scanProgress(got, n);
  if(got >= n){
    let data = '';
    for(let k = 1; k <= n; k++) data += SCAN.parts[k] || '';
    stopScan();
    try { importTourPacket(JSON.parse(fflate.strFromU8(fflate.inflateSync(unb64url(data))))); }
    catch(e){ toast(T().tourImportErr); }
  }
  return true;
}
function decodeImageData(id){
  try { const c = jsQR(id.data, id.width, id.height, { inversionAttempts: 'attemptBoth' }); return c ? c.data : null; } catch(e){ return null; }
}
function openScan(){
  const t = T();
  SCAN = scanReset();
  let el = $('scan');
  if(!el){ el = document.createElement('div'); el.id = 'scan'; document.body.appendChild(el); }
  el.hidden = false;
  el.innerHTML = '<button class="shx" data-act="scanClose" aria-label="' + esc(t.close) + '">✕</button>' +
    '<div class="scan-in"><div class="sht" style="font-size:22px">' + esc(t.scanTitle) + '</div><div class="scan-v"><video id="scan-video" playsinline muted autoplay></video><i></i></div>' +
    '<div id="scan-st" class="shs" style="font-size:17px">' + esc(t.scanHint) + '</div>' +
    '<button class="btn soft" data-act="scanPhoto" style="max-width:320px;margin:10px auto 0">📷 ' + esc(t.scanPhoto) + '</button>' +
    '<div class="hint" style="color:rgba(255,255,255,.7);text-align:center;max-width:420px;margin:10px auto 0">' + esc(t.scanPhotoHint) + '</div></div>';
  const v = $('scan-video');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ const st = $('scan-st'); if(st) st.textContent = t.scanNoCam; return; }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }).then(stream => {
    if(!SCAN){ stream.getTracks().forEach(tr => tr.stop()); return; }
    SCAN.stream = stream; v.srcObject = stream; v.play().catch(() => {});
    const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
    const loop = ts => {
      if(!SCAN || !SCAN.stream) return;
      SCAN.raf = requestAnimationFrame(loop);
      if(ts - SCAN.last < 140 || !v.videoWidth) return;
      SCAN.last = ts;
      const k = Math.min(1, 720 / Math.max(v.videoWidth, v.videoHeight));
      cv.width = Math.round(v.videoWidth * k); cv.height = Math.round(v.videoHeight * k);
      cx.drawImage(v, 0, 0, cv.width, cv.height);
      const txt = decodeImageData(cx.getImageData(0, 0, cv.width, cv.height));
      if(txt) scanFeed(txt);
    };
    SCAN.raf = requestAnimationFrame(loop);
  }).catch(() => { const st = $('scan-st'); if(st) st.textContent = t.scanNoCam; });
}
function stopScan(){
  if(SCAN){ if(SCAN.raf) cancelAnimationFrame(SCAN.raf); if(SCAN.stream) SCAN.stream.getTracks().forEach(tr => tr.stop()); }
  const el = $('scan'); if(el){ el.hidden = true; el.innerHTML = ''; }
  const keep = SCAN && SCAN.n && Object.keys(SCAN.parts).length < SCAN.n ? SCAN : null;
  SCAN = null;
  return keep;
}
function decodePhoto(file){
  const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => {
    const k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(im.naturalWidth * k); cv.height = Math.round(im.naturalHeight * k);
    const cx = cv.getContext('2d'); cx.drawImage(im, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
    const txt = decodeImageData(cx.getImageData(0, 0, cv.width, cv.height));
    if(!txt || !scanFeed(txt)) toast(T().scanNoCode);
  };
  im.onerror = () => { URL.revokeObjectURL(url); toast(T().imgFailed); };
  im.src = url;
}

/* ----- Signal bei gesperrtem Bildschirm (lokale Benachrichtigung) -----
   Laeuft die Uhr, plant die App zwei Benachrichtigungen (letzte Minute,
   Ende). Bei Pause, Reset oder Korrektur werden sie neu geplant. */
const LN = () => window.cordova && window.cordova.plugins && window.cordova.plugins.notification && window.cordova.plugins.notification.local;
const LN_IDS = [7101, 7102];
function clockChanged(x){
  const ln = LN();
  if(!ln) return;
  try { ln.cancel(LN_IDS, () => {}); } catch(e){}
  const k = x && x.clock;
  if(!x || !k || !k.since || x.done || !x.cfg.sound) return;
  const now = Date.now(), rem = clockDurMs(x, k) - clockEl(k, now);
  if(rem <= 2000) return;
  const t = T(), A = ana(x), notes = [];
  const what = slotTitle(x, k.s, A);
  if(rem > 65000) notes.push({ id: LN_IDS[0], title: x.name, text: t.lnWarn(what), trigger: { at: new Date(now + rem - 60000) }, foreground: false });
  notes.push({ id: LN_IDS[1], title: x.name, text: t.lnEnd(what), trigger: { at: new Date(now + rem) }, foreground: false });
  const go2 = () => { try { ln.schedule(notes); } catch(e){} };
  try { ln.hasPermission(ok => { if(ok) go2(); else ln.requestPermission(g => { if(g) go2(); }); }); } catch(e){ go2(); }
}

    QRSHOW = { parts: qrParts(x), i: 0, timer: null };
    openSheet(t.handQr, t.qrHint(QRSHOW.parts.length), '<div id="qr-box"></div>' +
      (QRSHOW.parts.length > 1 ? '<div class="row2" style="margin-top:10px"><button class="btn sm ghost" data-act="qrStep" data-d="-1">‹</button><button class="btn sm soft" data-act="qrAuto">' + esc(t.qrAuto) + '</button><button class="btn sm ghost" data-act="qrStep" data-d="1">›</button></div>' : ''));
    renderQrSheet();
    if(QRSHOW.parts.length > 1) A.qrAuto();
  },
  qrStep(el){ if(!QRSHOW) return; if(QRSHOW.timer){ clearInterval(QRSHOW.timer); QRSHOW.timer = null; } QRSHOW.i = (QRSHOW.i + (+el.dataset.d) + QRSHOW.parts.length) % QRSHOW.parts.length; renderQrSheet(); },
  qrAuto(){
    if(!QRSHOW) return;
    if(QRSHOW.timer){ clearInterval(QRSHOW.timer); QRSHOW.timer = null; return; }
    QRSHOW.timer = setInterval(() => { if(!QRSHOW || !$('qr-box')){ stopQrShow(); return; } QRSHOW.i = (QRSHOW.i + 1) % QRSHOW.parts.length; renderQrSheet(); }, 1400);
  },
  /* Empfangen */
  receive(){
    const t = T();
    openSheet(t.receive, t.receiveHint, act('recvFile', '📄', t.recvFile, t.recvFileHint) + act('recvScan', '🔳', t.recvScan, t.recvScanHint));
  },
  recvFile(){
    closeSheet();
    pickFile(data => {
      if(data && data.kind === 'tour') importTourPacket(data);
      else if(data && data.app === 'turnierpro') backupImport(data);
      else toast(T().tourImportErr);
    });
  },
  recvScan(){ closeSheet(); openScan(); },
  scanClose(){ stopScan(); },
  scanPhoto(){ pickImage(f => decodePhoto(f)); },
  importReplace(){
    const x = PENDING_IMPORT; PENDING_IMPORT = null;
    if(!x) return;
    DB.tours = DB.tours.filter(y => y.id !== x.id);
    finishTourImport(x);
  },
  importCopy(){
    const x = PENDING_IMPORT; PENDING_IMPORT = null;
    if(!x) return;
    x.id = uid(); x.name = (x.name + ' ' + T().copySuffix).slice(0, 60);
    finishTourImport(x);
  },
  /* Pro */
  paywall(el){ const f = el && el.dataset ? el.dataset.f : ''; openSheet(T().proTitle, '', paywallBody(f)); },
  proBuy(){
    const CP = window.CdvPurchase;
    if(!CP || !CP.store){ toast(T().proNoStore); return; }
    const p = CP.store.get(PRO_ID), o = p && p.getOffer();
    if(!o){ toast(T().proNoStore); return; }
    o.order().then(err => { if(err && err.code !== CP.ErrorCode.PAYMENT_CANCELLED) toast(T().proFailed); });
  },
  proRestore(){
    const CP = window.CdvPurchase;
    if(!CP || !CP.store){ toast(T().proNoStore); return; }
    CP.store.restorePurchases().then(() => { const p = CP.store.get(PRO_ID); if(p && p.owned){ DB.pro = true; save(); render(false); closeSheet(); toast(T().proRestored); } else toast(T().proNothing); });
  }
});

/* =====================================================================
   EREIGNISSE
   ===================================================================== */
let dragEndedAt = 0;
document.addEventListener('click', e => {
  if(DRAG || Date.now() - dragEndedAt < 350) return;
  if(lpSuppress){ lpSuppress = false; e.preventDefault(); return; }   // Klick nach langem Druecken schlucken
  const el = e.target.closest('[data-act]');
  if(el){
    const f = A[el.dataset.act];
    if(f){ e.preventDefault(); f(el); }
    return;
  }
  // Auslosung: Team antippen = auswaehlen, zweites Team antippen = tauschen
  const dd = e.target.closest('.dd');
  if(dd && cur().v === 'draw'){
    const x = curTour(), id = dd.dataset.dd;
    if(!DSEL) DSEL = id;
    else if(DSEL === id) DSEL = null;
    else { swapTeams(x, DSEL, id); DSEL = null; vibrate(20); }
    render(false);
  }
});
/* Langes Druecken auf ein Turnier in der Liste -> Menue (Oeffnen, Kopieren, Weitergeben, Loeschen) */
let LP = null, lpSuppress = false;
function lpCancel(){ if(LP){ clearTimeout(LP.t); LP.row.classList.remove('lp'); LP = null; } }
function lpFire(row){
  lpCancel();
  if(lpSuppress || sheetOpen() || !row.isConnected) return;
  lpSuppress = true; vibrate(25);
  A.tourLong(row);
}
document.addEventListener('pointerdown', e => {
  lpSuppress = false; lpCancel();
  if(e.button > 0) return;
  const row = e.target.closest('.list-row[data-act="openTour"]');
  if(!row) return;
  row.classList.add('lp');
  LP = { row, x: e.clientX, y: e.clientY, t: setTimeout(() => lpFire(row), 550) };
});
document.addEventListener('pointermove', e => { if(LP && Math.hypot(e.clientX - LP.x, e.clientY - LP.y) > 10) lpCancel(); });
document.addEventListener('pointerup', lpCancel);
document.addEventListener('pointercancel', lpCancel);
$('view').addEventListener('scroll', lpCancel, { passive: true });
document.addEventListener('contextmenu', e => {   // Android-Langdruck / Rechtsklick am Computer
  const row = e.target.closest('.list-row[data-act="openTour"]');
  if(!row) return;
  e.preventDefault();
  if(!lpSuppress) lpFire(row);
});
/* Ziehen am Griff ⠿ (Maus und Finger) */
document.addEventListener('pointerdown', e => {
  const hnd = e.target.closest('.dd .h');
  if(!hnd || cur().v !== 'draw') return;
  const it = hnd.closest('.dd'), rect = it.getBoundingClientRect();
  e.preventDefault();
  const g = it.cloneNode(true);
  g.classList.add('dghost'); g.style.width = rect.width + 'px'; g.style.left = rect.left + 'px'; g.style.top = rect.top + 'px';
  document.body.appendChild(g);
  it.classList.add('place');
  DRAG = { id: it.dataset.dd, el: it, g, dx: e.clientX - rect.left, dy: e.clientY - rect.top, zone: null, before: null, moved: false };
  try { hnd.setPointerCapture(e.pointerId); } catch(err){}
  vibrate(15);
});
function dragTarget(x, y){
  const el = document.elementFromPoint(x, y);
  const zone = el && el.closest('[data-zone]');
  if(!zone) return { zone: null, before: null };
  const items = Array.from(zone.querySelectorAll('.dd')).filter(d => d.dataset.dd !== DRAG.id);
  let before = null;
  for(const d of items){ const r = d.getBoundingClientRect(); if(y < r.top + r.height / 2){ before = d.dataset.dd; break; } }
  return { zone: zone.dataset.zone, before, el: zone };
}
document.addEventListener('pointermove', e => {
  if(!DRAG) return;
  e.preventDefault();
  DRAG.moved = true;
  DRAG.g.style.left = (e.clientX - DRAG.dx) + 'px'; DRAG.g.style.top = (e.clientY - DRAG.dy) + 'px';
  const tg = dragTarget(e.clientX, e.clientY);
  document.querySelectorAll('.gcard.over').forEach(z => z.classList.remove('over'));
  if(tg.el) tg.el.classList.add('over');
  DRAG.zone = tg.zone; DRAG.before = tg.before;
  // am Rand automatisch scrollen
  const v = $('view'), r = v.getBoundingClientRect();
  if(e.clientY < r.top + 50) v.scrollTop -= 12; else if(e.clientY > r.bottom - 50) v.scrollTop += 12;
}, { passive: false });
function endDrag(){
  if(!DRAG) return;
  const d = DRAG; DRAG = null; dragEndedAt = Date.now();
  d.g.remove(); d.el.classList.remove('place');
  document.querySelectorAll('.gcard.over').forEach(z => z.classList.remove('over'));
  if(d.moved && d.zone){ moveTeam(curTour(), d.id, d.zone, d.before); DSEL = null; vibrate(20); }
  render(false);
}
document.addEventListener('pointerup', endDrag);
document.addEventListener('pointercancel', endDrag);

document.addEventListener('input', e => {
  const r = cur(), id = e.target.id;
  if(id === 'tm-name' && r.v === 'team'){
    const x = teamById(r.id), v = str(e.target.value, 50);
    if(x && v){ x.name = v; DB.tours.forEach(tr => { if(!tr.done) tr.teams.forEach(en => { if(en.id === x.id) en.name = v; }); }); save(); $('title').textContent = v; }
  }
  if(id === 'tm-club' && r.v === 'team'){ const x = teamById(r.id); if(x){ x.club = str(e.target.value, 60); save(); } }
  if(id === 'tr-name' && r.v === 'setup'){ const x = curTour(), v = str(e.target.value, 60); if(x && v){ x.name = v; save(); } }
  if(/^set\d+[ha]$/.test(id)) updateResUI();
});
document.addEventListener('change', e => {
  const r = cur(), id = e.target.id, x = (r.v === 'setup') ? curTour() : null;
  if(!x) return;
  if(id === 'tr-date' && /^\d{4}-\d{2}-\d{2}$/.test(e.target.value)){ x.date = e.target.value; save(); }
  if(id === 'tr-start' && /^\d{1,2}:\d{2}/.test(e.target.value)){ x.cfg.start = e.target.value.slice(0, 5); save(); render(false); }
  if(id === 'tr-fields'){ x.cfg.fieldNames = e.target.value.split(',').map(s => str(s, 20)); save(); }
  if(id === 'tr-refs'){
    x.cfg.refList = e.target.value.split(/[\n,;]+/).map(s => str(s, 30)).filter(Boolean).slice(0, 40);
    if(built(x)) Engine.assignRefs(x);
    save(); render(false);
  }
});
/* Urkunden-Vorlagen: Texte, Unterschriften, Ort */
document.addEventListener('change', e => {
  if(cur().v !== 'certcfg') return;
  const el = e.target, P = DB.prefs.cert;
  if(el.classList.contains('cert-tx')){ const tx = Object.assign({}, P.texts[CERT_TAB] || {}); tx[el.dataset.k] = el.value.slice(0, 120); P.texts[CERT_TAB] = tx; }
  else if(el.id === 'cert-sig1') P.sig1 = str(el.value, 40);
  else if(el.id === 'cert-sig2') P.sig2 = str(el.value, 40);
  else if(el.id === 'cert-place') P.place = str(el.value, 40);
  else return;
  save();
  certPreview(null, CERT_TAB).then(src => { const im = $('cert-prev'); if(im) im.src = src; });
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  if(e.target.id === 'p-name'){ e.preventDefault(); A.addPlayer(); }
  if(e.target.id === 'p-nr'){ e.preventDefault(); $('p-name').focus(); }
  if(e.target.id === 'nt-name'){ e.preventDefault(); A.createTeam(); }
});

/* Cordova: Android-Zuruecktaste */
document.addEventListener('deviceready', () => {
  document.addEventListener('backbutton', e => { e.preventDefault(); back(); }, false);
  initStore();
}, false);

/* Web-Fassung: offline nutzbar */
if('serviceWorker' in navigator && location.protocol === 'https:' && location.hostname !== 'localhost'){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

render(true);
ImgDB.all().then(m => { Object.assign(IMG, m); if(Object.keys(m).length) render(false); }).catch(() => {});
</script>
