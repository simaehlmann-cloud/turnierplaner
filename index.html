<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<!-- Content-Security-Policy: TurnierPro laedt nichts nach. Alles steckt in
     dieser Datei, die App baut von sich aus keine Verbindung nach aussen auf. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; font-src 'self'; media-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'none'" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#111111" />
<title>TurnierPro</title>
<link rel="icon" type="image/png" href="image.png">
<link rel="apple-touch-icon" href="image.png">
<link rel="manifest" href="manifest.json">
<style>
:root {
  /* Farbfamilie wie PitchPro: dunkle Oberflaeche, Rasengruen */
  --bg:#1a1a1a; --surface:#262626; --surface2:#303030; --line:#3b3b3b;
  --text:#f3f3f3; --muted:#a9a9a9;
  --green:#4caf50; --green-d:#2e7d32; --green-soft:#24402a;
  --blue:#2a6f97; --blue-soft:#1f3442; --blue-ink:#7fb8dc;
  --yellow:#f4c20d; --red:#e53935; --amber:#ff9f1c; --amber-soft:#3d2c12;
  --gold:#ffca28; --silver:#c0c6cc; --bronze:#d08a4c;
  --top:#111111; --soft-ink:#a5e0a8;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --r:14px;
}
/* Hell-Modus: besser lesbar in praller Sonne */
:root[data-theme="light"] {
  --bg:#eef2ee; --surface:#ffffff; --surface2:#e6ece7; --line:#c9d3cb;
  --text:#0e1a12; --muted:#4f5d54;
  --green:#2e7d32; --green-d:#1f6b2a; --green-soft:#dcefdf;
  --blue:#2a6f97; --blue-soft:#dde9f3; --blue-ink:#1f5f86;
  --amber-soft:#fff1d6; --amber:#c76a00;
  --top:#0b3d1f; --soft-ink:#1b5e20;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; -webkit-text-size-adjust:100%; }
body { display:flex; flex-direction:column; overflow:hidden; user-select:none; -webkit-user-select:none; }
input, textarea, select { user-select:text; -webkit-user-select:text; font:inherit; }
button { font:inherit; color:inherit; border:0; background:none; cursor:pointer; }
.num { font-variant-numeric:tabular-nums; }

/* ---------- Kopfzeile ---------- */
#top { color:#fff; background:var(--top); padding:calc(var(--safe-t) + 6px) 8px 8px; display:flex; align-items:center; gap:4px; min-height:56px; flex:0 0 auto; }
#top .title { flex:1; font-size:19px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-left:6px; }
#top button { min-width:44px; height:44px; padding:0 10px; border-radius:10px; font-size:16px; font-weight:700; }
#top button:active { background:#222; }
#back { font-size:26px !important; }
.brand { display:inline-flex; align-items:center; gap:12px; }
.brand img { border-radius:10px; flex:0 0 38px; box-shadow:0 2px 8px rgba(0,0,0,.4); }
.brand span { font-size:24px; font-weight:900; letter-spacing:.2px; }
@media (max-width:430px){ .brand span { font-size:20px; } .brand { gap:8px; } .brand img { width:32px; height:32px; flex-basis:32px; } }
@media (max-width:360px){ .brand span { font-size:17px; } }
#top button#right, #top button#right2 { font-size:22px; }
#back[hidden], #right[hidden], #right2[hidden], #flags[hidden] { display:none; }
#flags { display:flex; gap:4px; margin-right:2px; }
#top button.flag { min-width:0; width:42px; height:40px; padding:0; display:flex; align-items:center; justify-content:center; border-radius:8px; }
.flag svg { border-radius:3px; opacity:.45; transition:opacity .15s, transform .15s; box-shadow:0 0 0 1px rgba(255,255,255,.25); }
.flag.on svg { opacity:1; transform:scale(1.1); box-shadow:0 0 0 2px #fff; }

/* Reiter im Turnier */
#tabs { display:flex; gap:6px; background:var(--top); padding:0 10px 10px; flex:0 0 auto; }
#tabs[hidden] { display:none; }
#tabs button { flex:1; min-height:40px; border-radius:10px; color:rgba(255,255,255,.75); font-weight:800; font-size:15px; background:rgba(255,255,255,.08); }
#tabs button.on { background:var(--green); color:#fff; }

#view { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 16px calc(var(--safe-b) + 90px); }
.wrap { max-width:760px; margin:0 auto; }
@media (min-width:900px){
  .wrap.wide { max-width:1100px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; align-items:start; }
  .cols > .sec:first-child { margin-top:0; }
}

/* ---------- Bausteine ---------- */
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; }
.card + .card { margin-top:12px; }
.sec { display:flex; justify-content:space-between; align-items:center; margin:22px 2px 8px; gap:8px; }
.sec h2 { margin:0; font-size:13px; font-weight:800; letter-spacing:1px; text-transform:uppercase; color:var(--muted); }
.sec .meta { font-size:13px; font-weight:800; color:var(--green); white-space:nowrap; }
.sec .link { color:var(--green); font-weight:700; font-size:14px; padding:6px 4px; }
.btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:50px; padding:0 16px;
  border-radius:var(--r); font-size:16px; font-weight:800; background:var(--green); color:#fff; text-align:center; }
.btn:active { filter:brightness(0.85); }
.btn.lg { min-height:60px; font-size:19px; }
.btn.soft { background:var(--green-soft); color:var(--soft-ink); }
.btn.ghost { background:transparent; border:1.5px solid var(--line); color:var(--text); }
.btn.danger { background:var(--red); }
.btn.blue { background:var(--blue); }
.btn.sm { min-height:40px; font-size:14px; width:auto; padding:0 14px; border-radius:10px; }
.btn[disabled] { opacity:.35; pointer-events:none; }
.row2 { display:flex; gap:8px; }
.row2 > * { flex:1; }
.stack > * + * { margin-top:8px; }
.hint { color:var(--muted); font-size:13px; line-height:1.45; margin:6px 2px 0; }
.empty { color:var(--muted); font-size:15px; padding:10px 2px; line-height:1.45; }
.warn { background:var(--amber-soft); border:1.5px solid var(--amber); border-radius:var(--r); padding:12px 14px; font-size:14px; line-height:1.45; margin-bottom:12px; }
.warn b { color:var(--amber); }
input.in, textarea.in, select.in { width:100%; min-height:50px; padding:0 12px; border-radius:var(--r); border:1.5px solid var(--line);
  background:var(--bg); color:var(--text); font-size:17px; outline:none; }
textarea.in { padding:12px; min-height:120px; resize:vertical; font-size:16px; }
input.in:focus, textarea.in:focus { border-color:var(--green); }
input.nr { width:68px; flex:0 0 68px; text-align:center; }
label.lb { display:block; font-size:13px; font-weight:700; color:var(--muted); margin:12px 2px 6px; }
.chips { display:flex; flex-wrap:wrap; gap:8px; }
.chip { padding:9px 14px; border-radius:999px; border:1.5px solid var(--line); font-size:15px; font-weight:600; background:var(--surface); }
.chip.on { background:var(--green); border-color:var(--green); color:#fff; }
.chip[disabled] { opacity:.4; pointer-events:none; }
.list-row { display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:12px 14px; margin-bottom:8px; width:100%; text-align:left; }
.list-row:active { background:var(--surface2); }
.list-row[data-act="openTour"] { -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
.list-row.lp { background:var(--surface2); transform:scale(.98); transition:transform .15s; }
.list-row .main { flex:1; min-width:0; }
.list-row .t1 { font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.list-row .t2 { font-size:13px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.list-row.off { opacity:.5; }
.big { font-size:20px; font-weight:900; color:var(--green); white-space:nowrap; }
.badge { display:inline-block; font-size:11px; font-weight:900; padding:2px 7px; border-radius:6px; background:var(--surface2); color:var(--muted); vertical-align:middle; }
.badge.g { background:var(--green); color:#fff; }
.badge.a { background:var(--amber); color:#1a1a1a; }

/* Logo bzw. Initialen-Kreis */
.logo { flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; border-radius:50%; overflow:hidden;
  font-weight:900; color:#fff; background:#555; }
.logo img { width:100%; height:100%; object-fit:contain; background:#fff; }
.stars { display:inline-flex; gap:1px; font-size:13px; color:var(--gold); letter-spacing:-1px; white-space:nowrap; }
.stars i { font-style:normal; color:var(--line); }

/* Stepper und Schalter */
.step { display:flex; align-items:center; justify-content:space-between; padding:6px 0; gap:8px; }
.step .lbl { font-size:16px; flex:1; }
.step .lbl small { display:block; color:var(--muted); font-size:12px; }
.step .ctl { display:flex; align-items:center; gap:6px; }
.step .ctl button { width:42px; height:42px; border-radius:21px; background:var(--green-soft); color:var(--soft-ink); font-size:24px; font-weight:700; }
.step .ctl button[disabled] { opacity:.3; pointer-events:none; }
.step .val { min-width:62px; text-align:center; font-size:17px; font-weight:800; }
.toggle { display:flex; align-items:center; gap:12px; padding:10px 0 4px; width:100%; text-align:left; }
.toggle .lbl { flex:1; font-size:16px; }
.toggle .lbl small { display:block; color:var(--muted); font-size:12px; }
.sw { width:52px; height:32px; border-radius:16px; background:var(--line); padding:3px; flex:0 0 52px; transition:background .15s; }
.sw i { display:block; width:26px; height:26px; border-radius:13px; background:#fff; transition:transform .15s; }
.sw.on { background:var(--green); } .sw.on i { transform:translateX(20px); }
.locked { opacity:.45; pointer-events:none; }
.sep { height:1px; background:var(--line); margin:10px 0; }

/* Teams im Turnier */
.trow { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
.trow:last-child { border-bottom:0; }
.trow .nm { flex:1; min-width:0; font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:left; }
.trow .nm small { display:block; font-weight:500; font-size:12px; color:var(--muted); }
.trow.off .nm { opacity:.45; text-decoration:line-through; }
.trow .x { width:36px; height:36px; border-radius:18px; color:var(--muted); font-size:18px; }
.crit { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
.crit:last-child { border-bottom:0; }
.crit .n { width:24px; font-weight:900; color:var(--green); }
.crit .l { flex:1; font-size:15px; font-weight:600; }
.crit button { width:38px; height:34px; border-radius:8px; background:var(--surface2); font-size:16px; }

/* Auslosung */
.groups { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:10px; }
.gcard { background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r); padding:10px; min-height:90px; }
.gcard.over { border-color:var(--green); background:var(--green-soft); }
.gcard h3 { margin:2px 4px 8px; font-size:15px; font-weight:900; display:flex; justify-content:space-between; align-items:center; }
.gcard h3 button { font-size:12px; font-weight:800; color:var(--green); padding:4px 6px; }
.dd { display:flex; align-items:center; gap:8px; width:100%; background:var(--surface2); border:1.5px solid transparent; border-radius:10px;
  padding:6px 8px; margin-bottom:6px; text-align:left; min-height:46px; }
.dd.sel { border-color:var(--amber); background:var(--amber-soft); }
.dd .h { touch-action:none; color:var(--muted); font-size:20px; padding:4px 6px; cursor:grab; }
.dd .nm { flex:1; min-width:0; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.dd .sn { font-weight:900; color:var(--green); min-width:24px; }
.dghost { position:fixed; z-index:40; pointer-events:none; opacity:.9; box-shadow:0 8px 20px rgba(0,0,0,.45); transform:rotate(-1.5deg); }
.dd.place { opacity:.25; }

/* Spielplan */
.slot { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); margin-bottom:10px; overflow:hidden; }
.slot.now { border:2px solid var(--green); }
.slot .sh { display:flex; align-items:center; gap:8px; padding:9px 12px; background:var(--surface2); font-size:13px; font-weight:800; color:var(--muted); }
.slot .sh .tm { font-size:16px; color:var(--text); font-weight:900; }
.slot .sh .lab { flex:1; }
.slot.now .sh { background:var(--green-soft); }
.m { display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:10px 12px; border-top:1px solid var(--line); min-height:56px; }
.m:first-of-type { border-top:0; }
.m:active { background:var(--surface2); }
.m .fd { flex:0 0 auto; min-width:28px; height:24px; padding:0 6px; border-radius:6px; background:var(--blue); color:#fff; font-size:12px; font-weight:900; display:flex; align-items:center; justify-content:center; }
.m .body { flex:1; min-width:0; }
.m .tms { display:flex; align-items:center; gap:6px; }
.m .tn { flex:1; min-width:0; font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px; }
.m .tn span { overflow:hidden; text-overflow:ellipsis; }
.m .tn.r { justify-content:flex-end; text-align:right; }
.m .tn.win { color:var(--soft-ink); }
.m .tn.ph { color:var(--muted); font-style:italic; font-weight:600; }
.m .sc { flex:0 0 auto; min-width:54px; text-align:center; font-size:18px; font-weight:900; }
.m .sc.open { color:var(--muted); font-weight:700; }
.m .sc small { display:block; font-size:10px; font-weight:700; color:var(--muted); }
.m .info { font-size:12px; color:var(--muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.m.void .tms { text-decoration:line-through; opacity:.5; }
.m.dim { opacity:.35; }
.m.mine { background:var(--blue-soft); }
.prog { height:6px; background:var(--surface2); border-radius:3px; overflow:hidden; margin-top:8px; }
.prog i { display:block; height:6px; background:var(--green); }

/* Tabelle */
table.tb { width:100%; border-collapse:collapse; font-size:14px; }
table.tb th { font-size:11px; color:var(--muted); font-weight:800; text-transform:uppercase; padding:6px 4px; text-align:center; }
table.tb th.l, table.tb td.l { text-align:left; }
table.tb td { padding:8px 4px; text-align:center; border-top:1px solid var(--line); }
table.tb td.pos { width:26px; font-weight:900; color:var(--muted); }
table.tb td.team { font-weight:700; max-width:0; width:100%; }
table.tb td.team div { display:flex; align-items:center; gap:6px; white-space:nowrap; overflow:hidden; }
table.tb td.team span { overflow:hidden; text-overflow:ellipsis; }
table.tb td.pts { font-weight:900; font-size:15px; }
table.tb tr.q td.pos { color:#fff; background:var(--green); border-radius:6px; }
table.tb tr.off td { opacity:.45; }
@media (max-width:420px){ table.tb .nx { display:none; } }
.tie { color:var(--amber); font-weight:900; }
.podium { display:flex; align-items:flex-end; justify-content:center; gap:8px; margin:6px 0 16px; }
.podium .pc { flex:1; max-width:150px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; }
.podium .pc .nm { font-weight:800; font-size:14px; line-height:1.2; max-width:100%; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
.podium .blk { width:100%; border-radius:10px 10px 0 0; display:flex; align-items:flex-start; justify-content:center; font-size:28px; font-weight:900; color:#1a1a1a; padding-top:6px; }
.rk { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); }
.rk .p { width:34px; font-weight:900; font-size:16px; text-align:center; }
.rk .nm { flex:1; font-weight:700; }

/* Turnieruhr */
.clockbox { background:var(--green-d); color:#fff; border-radius:var(--r); padding:16px; text-align:center; }
.clockbox .rd { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.clockbox .rd button { width:46px; height:46px; border-radius:23px; background:rgba(255,255,255,.15); font-size:24px; font-weight:800; color:#fff; }
.clockbox .rd button[disabled] { opacity:.3; }
.clockbox .rdt { font-size:15px; font-weight:800; }
.clockbox .rdt small { display:block; font-weight:600; opacity:.8; font-size:13px; }
#clk { font-size:min(26vw, 140px); font-weight:900; letter-spacing:2px; line-height:1.1; margin:10px 0 4px; font-variant-numeric:tabular-nums; }
#clk.warn1 { color:var(--yellow); }
#clk.over { color:#ffb4b0; }
#clkst { font-size:14px; font-weight:700; opacity:.85; min-height:20px; }
.cctl { display:flex; gap:8px; margin-top:14px; }
.cctl .btn { background:rgba(255,255,255,.95); color:var(--green-d); min-height:54px; font-size:18px; }
.cctl .btn.alt { background:rgba(0,0,0,.25); color:#fff; flex:0 0 64px; }
.cctl .btn.main { flex:2; }

/* ---------- Blatt (Dialog von unten) ---------- */
#ov { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:20; }
#ov.open { display:block; }
#sheet { position:fixed; left:0; right:0; bottom:0; z-index:21; background:var(--bg); border-radius:22px 22px 0 0;
  padding:12px 16px calc(var(--safe-b) + 16px); max-height:90vh; overflow-y:auto; transform:translateY(105%); transition:transform .2s ease;
  max-width:720px; margin:0 auto; border-top:1px solid var(--line); }
#sheet.open { transform:translateY(0); }
#sheet .grab { width:44px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 12px; }
#sheet h3 { margin:0; font-size:21px; font-weight:800; }
#sheet .sub { color:var(--muted); font-size:14px; margin:3px 0 12px; }
.act { display:flex; align-items:center; gap:12px; width:100%; min-height:56px; padding:8px 16px; border-radius:var(--r);
  background:var(--surface); border:1px solid var(--line); text-align:left; margin-bottom:8px; }
.act:active { background:var(--surface2); }
.act .ic { font-size:22px; width:28px; text-align:center; }
.act .l { font-size:17px; font-weight:700; }
.act .h { font-size:13px; color:var(--muted); }
.act.on { border-color:var(--green); background:var(--green-soft); }
/* Ergebnis-Eingabe */
.res { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:start; margin:6px 0 4px; }
.res .side { display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; min-width:0; }
.res .side .nm { font-weight:800; font-size:16px; line-height:1.25; max-width:100%; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; min-height:40px; }
.res .colon { font-size:40px; font-weight:900; padding-top:166px; color:var(--muted); }
.res .ctr { display:flex; flex-direction:column; align-items:center; gap:6px; }
.res .ctr button { width:64px; height:52px; border-radius:14px; background:var(--green-soft); color:var(--soft-ink); font-size:28px; font-weight:800; }
.res .ctr .v { font-size:52px; font-weight:900; min-width:64px; text-align:center; line-height:1; }
.setrow { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.setrow span { width:70px; font-weight:800; color:var(--muted); }
.setrow input { flex:1; text-align:center; min-height:46px; font-size:20px; font-weight:800; }
.setrow b { color:var(--muted); }
.sumline { text-align:center; font-weight:800; color:var(--muted); margin:6px 0 2px; }

/* ---------- Siegerehrung ---------- */
#show { position:fixed; inset:0; z-index:60; background:radial-gradient(circle at 50% 30%, #2e7d32 0%, #0b3d1f 55%, #05140a 100%); color:#fff;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:calc(var(--safe-t) + 20px) 20px calc(var(--safe-b) + 20px); overflow:hidden; }
#show[hidden] { display:none; }
#show .shin { display:flex; flex-direction:column; align-items:center; gap:14px; max-width:820px; width:100%; animation:pop .45s ease; }
#show .shx { position:absolute; top:calc(var(--safe-t) + 10px); right:14px; width:46px; height:46px; border-radius:23px; background:rgba(255,255,255,.15); font-size:20px; z-index:2; }
#show .sht { font-size:clamp(26px, 6vw, 48px); font-weight:900; }
#show .shs { font-size:clamp(17px, 3.5vw, 26px); opacity:.85; font-weight:700; }
#show .shbig { font-size:clamp(70px, 18vw, 150px); line-height:1; font-weight:900; }
#show .shn { font-size:clamp(30px, 8vw, 64px); font-weight:900; line-height:1.1; }
#show .shph { max-width:min(90vw, 640px); max-height:38vh; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.5); object-fit:cover; }
#show .shf { position:absolute; bottom:calc(var(--safe-b) + 14px); left:0; right:0; opacity:.6; font-weight:700; }
#show .podium.big { width:100%; max-width:640px; }
#show .podium.big .pc .nm { font-size:clamp(15px, 3vw, 22px); color:#fff; }
#show .podium.big .blk { font-size:40px; }
@keyframes pop { from { transform:scale(.85); opacity:0; } to { transform:scale(1); opacity:1; } }
.confetti { position:absolute; inset:0; pointer-events:none; }
.confetti i { position:absolute; top:-20px; width:10px; height:16px; border-radius:2px; animation:fall 3.2s linear infinite; }
@keyframes fall { to { transform:translateY(110vh) rotate(720deg); } }

/* ---------- QR-Scanner ---------- */
#scan { position:fixed; inset:0; z-index:60; background:#0b0f0c; color:#fff; display:flex; align-items:center; justify-content:center; padding:calc(var(--safe-t) + 20px) 18px calc(var(--safe-b) + 20px); }
#scan[hidden] { display:none; }
#scan .shx { position:absolute; top:calc(var(--safe-t) + 10px); right:14px; width:46px; height:46px; border-radius:23px; background:rgba(255,255,255,.15); font-size:20px; color:#fff; }
#scan .scan-in { width:100%; max-width:520px; display:flex; flex-direction:column; align-items:center; gap:12px; text-align:center; }
#scan .scan-v { position:relative; width:100%; aspect-ratio:1; border-radius:18px; overflow:hidden; background:#000; }
#scan video { width:100%; height:100%; object-fit:cover; }
#scan .sht { font-weight:900; } #scan .shs { opacity:.85; font-weight:700; }
#scan .scan-v i { position:absolute; inset:14%; border:4px solid rgba(255,255,255,.85); border-radius:16px; box-shadow:0 0 0 999px rgba(0,0,0,.25); }

/* ---------- Beamer ---------- */
body.beam #view { padding:calc(var(--safe-t) + 14px) 18px 24px; }
body.beam .wrap.wide { max-width:1600px; }
.bm-head { display:flex; align-items:center; gap:16px; margin-bottom:6px; }
.bm-head > div:first-child { flex:1; min-width:0; }
.bm-name { font-size:clamp(22px, 3.2vw, 40px); font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.bm-sub { color:var(--muted); font-weight:700; font-size:clamp(14px, 1.8vw, 22px); }
#bclk { font-size:clamp(44px, 7vw, 96px); font-weight:900; font-variant-numeric:tabular-nums; color:var(--green); }
#bclk.over { color:var(--red); }
.bm-x { width:44px; height:44px; border-radius:22px; background:var(--surface2); font-size:18px; flex:0 0 44px; }
.bm-grid { display:grid; grid-template-columns:1fr; gap:0 22px; align-items:start; }
@media (min-width:900px){ .bm-grid { grid-template-columns:1fr 1fr; } body.beam .m .tn { font-size:20px; } body.beam .m .sc { font-size:24px; } body.beam table.tb { font-size:18px; } }
#toast { position:fixed; left:50%; bottom:calc(var(--safe-b) + 24px); transform:translateX(-50%); background:#f3f3f3; color:#111;
  padding:12px 18px; border-radius:12px; font-weight:600; font-size:15px; z-index:50; opacity:0; pointer-events:none; transition:opacity .2s;
  max-width:90vw; text-align:center; }
#toast.show { opacity:1; }
.about p { margin:0; font-size:15px; line-height:1.55; }
.about p + p { margin-top:10px; }
.about b { color:var(--soft-ink); }
.about-head { display:flex; align-items:center; gap:16px; }
.about-head img { border-radius:16px; flex:0 0 72px; }
.about-head .ah1 { font-size:24px; font-weight:900; }
.photo { width:100%; max-height:260px; object-fit:cover; border-radius:12px; display:block; }
.imgrow { display:flex; align-items:center; gap:12px; }
.imgrow .ph { width:72px; height:72px; border-radius:12px; background:var(--surface2); display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--muted); font-size:28px; flex:0 0 72px; }
.imgrow .ph img { width:100%; height:100%; object-fit:cover; }
.imgrow .ph.lg img { object-fit:contain; background:#fff; }
.prow { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); }
.prow .n { width:40px; text-align:center; font-weight:900; color:var(--green); }
.prow .nm { flex:1; font-weight:600; }
</style>

  try { raw = JSON.parse(localStorage.getItem(DATA_KEY) || 'null'); } catch(e){ raw = null; }
  const d = { v: 1, teams: [], tours: [], lastCfg: null, lastBackupAt: 0, backupSnooze: 0, prefs: cleanPrefs(null), tpls: [] };
  if(!raw || typeof raw !== 'object') return d;
  d.teams = (Array.isArray(raw.teams) ? raw.teams : []).map(cleanTeam).filter(Boolean);
  d.tours = (Array.isArray(raw.tours) ? raw.tours : []).map(cleanTour).filter(Boolean);
  d.lastCfg = raw.lastCfg ? cleanCfg(raw.lastCfg) : null;
  d.lastBackupAt = num(raw.lastBackupAt, 0, 9e15, 0);
  d.backupSnooze = num(raw.backupSnooze, 0, 9e15, 0);
  d.prefs = cleanPrefs(raw.prefs);
  d.pro = raw.pro === true;
  d.tpls = (Array.isArray(raw.tpls) ? raw.tpls : []).slice(0, 50).map(cleanTpl).filter(Boolean);
  return d;
}

/* ---------------------------------------------------------------------
   BILDER (IndexedDB) – Wappen und Mannschaftsfotos
   localStorage fasst nur rund 5 MB; Bilder liegen deshalb getrennt.
   IMG haelt alle Bilder als data:-URL im Speicher (klein, da verkleinert).
--------------------------------------------------------------------- */
const IMG = {};
const ImgDB = (function(){
  let dbp = null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try {
        const rq = indexedDB.open('turnierpro', 1);
        rq.onupgradeneeded = () => { rq.result.createObjectStore('img'); };
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error);
      } catch(e){ rej(e); }
    });
    return dbp;
  }
  function tx(mode, fn){
    return open().then(db => new Promise((res, rej) => {
      const t = db.transaction('img', mode), st = t.objectStore('img');
      const r = fn(st);
      t.oncomplete = () => res(r && r.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    }));
  }
  return {
    all(){
      return open().then(db => new Promise((res, rej) => {
        const out = {}, t = db.transaction('img', 'readonly'), st = t.objectStore('img');
        const rq = st.openCursor();
        rq.onsuccess = () => { const c = rq.result; if(c){ out[c.key] = c.value; c.continue(); } };
        t.oncomplete = () => res(out);
        t.onerror = () => rej(t.error);
      }));
    },
    put(k, v){ return tx('readwrite', st => st.put(v, k)); },
    del(k){ return tx('readwrite', st => st.delete(k)); }
  };
})();
function setImg(key, dataUrl){
  if(dataUrl) IMG[key] = dataUrl; else delete IMG[key];
  return (dataUrl ? ImgDB.put(key, dataUrl) : ImgDB.del(key)).catch(() => toast(T().imgSaveFailed));
}
/* Bild verkleinern: Wappen als PNG (Transparenz bleibt), Fotos als JPEG */
function shrinkImage(file, kind){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const max = kind === 'logo' ? 320 : kind === 'bg' ? 2400 : 1200;
      const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
      const w = Math.max(1, Math.round(im.naturalWidth * k)), h = Math.max(1, Math.round(im.naturalHeight * k));
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const cx = cv.getContext('2d');
      if(kind !== 'logo'){ cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); }
      cx.drawImage(im, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res(kind === 'logo' ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', 0.82));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    im.src = url;
  });
}

async function shareText(text, title){
  if(window.TbShare && window.TbShare.shareText){
    try { await window.TbShare.shareText(text, title || ''); return; } catch(e){}
  }
  const ss = window.plugins && window.plugins.socialsharing;
  if(window.cordova && ss && ss.shareWithOptions){
    ss.shareWithOptions({ message: text, subject: title || '', iPadPopupCoordinates: iPadAnchor() }, () => {}, () => {});

  }
  if(navigator.share){

    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(text); toast(T().copied); }

}
function blobToBase64(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = rej;
    r.readAsDataURL(blob);
  });
}
/* Datei weitergeben: Android legt sie in Downloads ab, iOS oeffnet das
   Teilen-Menue (Sichern, AirDrop, Drucken, WhatsApp ...). */
async function saveBlob(blob, name, mime, asImage){
  if(window.TbShare && (asImage ? window.TbShare.shareFile : window.TbShare.saveFile)){
    const b64 = await blobToBase64(blob);
    if(asImage){ await window.TbShare.shareFile(name, mime, b64); return ''; }
    return await window.TbShare.saveFile(name, mime, b64) ? 'downloads' : '';
  }
  const ss = window.plugins && window.plugins.socialsharing;
  if(window.cordova && ss && ss.shareWithOptions){
    const dataUrl = 'df:' + name + ';data:' + mime + ';base64,' + await blobToBase64(blob);
    return new Promise((res, rej) => ss.shareWithOptions({ subject: name, files: [dataUrl], chooserTitle: name, iPadPopupCoordinates: iPadAnchor() },
      r => res(r && r.completed === false ? 'abbruch' : ''), e => rej(new Error(String(e || 'share')))));
  }
  if(navigator.canShare){
    try {
      const f = new File([blob], name, { type: mime });
      if(navigator.canShare({ files: [f] }) && (IST_IOS || asImage)){ await navigator.share({ files: [f] }); return ''; }
    } catch(e){ if(e && e.name === 'AbortError') return 'abbruch'; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.download = name; a.href = url; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return '';
}

/* =====================================================================
   TURNIER-ENGINE  (ENGINE-START)
   Reine Logik ohne Oberflaeche: Auslosung, Spielplan, Felder, Zeiten,
   Schiedsrichter, Tabellen, K.o.-Baum und Endstand. Wird in
   tests/engine.test.js ohne Browser geprueft.

   Turnier t:
     cfg      Einstellungen (siehe DEFAULT_CFG)
     teams    [{ id, name, club, str, act, ref }]   act=false -> passiv
     groups   [{ n:'A', ids:[teamId,...] }]          Liga = eine Gruppe
     seeds    [teamId,...]                           nur reiner K.o.-Modus
     matches  [{ id, ph:'g'|'ko', g, rd, h, a, hs, as, oh, oa, kr, ks, lbl,
                 slot, f, ref, res }]
       ph   Phase: 'g' Gruppen/Liga, 'ko' Finalrunde
       h/a  Team-IDs (Gruppenphase); hs/as Quellen (Finalrunde):
              {t:'s',i}   Setzplatz i (K.o.-Modus)
              {t:'g',g,r} Rang r der Gruppe g
              {t:'x',r,i} i-bester Gruppen-r-ter (z. B. beste Dritte)
              {t:'w',m}   Sieger von Spiel m, {t:'l',m} Verlierer
       oh/oa  manuell festgelegtes Team (Losentscheid, Korrektur)
       res  { h, a, sets:[[h,a]..], dec:'h'|'a', ph, pa, wo:'h'|'a' }
            dec = Sieger nach Entscheidung (Neunmeter, Los ...) bei Gleichstand
            ph/pa = optionales Ergebnis dieser Entscheidung
            wo  = Wertung ohne Spiel (kampflos) fuer diese Seite
   ===================================================================== */
const Engine = (function(){
  let RNG = Math.random;
  let UID = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

  const nextPow2 = n => { let p = 1; while(p < n) p *= 2; return p; };
  /* Setzliste im Turnierbaum: 1 und 2 treffen erst im Finale aufeinander */
  function seedOrder(P){
    let o = [1];
    while(o.length < P){
      const n = o.length * 2, x = [];
      o.forEach(s => { x.push(s); x.push(n + 1 - s); });
      o = x;
    }
    return o;
  }
  function shuffle(a){
    const x = a.slice();
    for(let i = x.length - 1; i > 0; i--){ const j = Math.floor(RNG() * (i + 1)); const t = x[i]; x[i] = x[j]; x[j] = t; }
    return x;
  }
  const GROUP_NAMES = 'ABCDEFGHIJKLMNOP';

  /* Jeder gegen jeden (Kreismethode). Liefert Spieltage mit Paarungen;
     Heimrecht wechselt, bei ungerader Zahl hat pro Spieltag ein Team frei. */
  function roundRobin(ids){
    const list = ids.slice();
    if(list.length < 2) return [];
    if(list.length % 2) list.push(null);
    const n = list.length, rounds = [];
    for(let r = 0; r < n - 1; r++){
      const pairs = [];
      for(let i = 0; i < n / 2; i++){
        const a = list[i], b = list[n - 1 - i];
        if(a == null || b == null) continue;
        pairs.push((i === 0 ? r % 2 === 1 : i % 2 === 1) ? [b, a] : [a, b]);
      }
      rounds.push(pairs);
      list.splice(1, 0, list.pop());
    }
    return rounds;
  }

  /* ------------------------------------------------------------------
     AUSLOSUNG
     method: 'random' Zufall, 'fair' Gruppenkoepfe (starke Teams verteilt),
             'perf' Leistungsgruppen (stark zu stark), 'manual' Reihenfolge
  ------------------------------------------------------------------ */
  function byStrength(teams){
    // gleiche Staerke zufaellig mischen, dann stabil nach Staerke sortieren
    return shuffle(teams).sort((a, b) => (b.str || 3) - (a.str || 3));
  }
  function groupSizes(n, g){
    const base = Math.floor(n / g), extra = n % g;
    return Array.from({ length: g }, (_, i) => base + (i < extra ? 1 : 0));
  }
  function draw(teams, cfg){
    const active = teams.filter(x => x.act !== false);
    const method = cfg.seed || 'fair';
    if(cfg.mode === 'league') return { groups: [{ n: '', ids: (method === 'manual' ? active : shuffle(active)).map(x => x.id) }], seeds: [] };
    if(cfg.mode === 'ko' || cfg.mode === 'kids'){
      const order = method === 'random' ? shuffle(active) : method === 'manual' ? active.slice() : byStrength(active);
      return { groups: [], seeds: order.map(x => x.id) };
    }
    const g = Math.max(1, Math.min(cfg.gCount || 2, Math.floor(active.length / 2) || 1));
    const groups = Array.from({ length: g }, (_, i) => ({ n: GROUP_NAMES[i] || String(i + 1), ids: [] }));
    if(method === 'fair'){
      // Schlangenlinie ueber Toepfe: Topf 1 = die g staerksten Teams usw.
      const sorted = byStrength(active);
      for(let k = 0; k < sorted.length; k += g){
        const pot = shuffle(sorted.slice(k, k + g));
        const order = (k / g) % 2 === 0 ? groups.map((_, i) => i) : groups.map((_, i) => g - 1 - i);
        pot.forEach((tm, j) => { groups[order[j]].ids.push(tm.id); });
      }
    } else {
      const list = method === 'random' ? shuffle(active) : method === 'perf' ? byStrength(active) : active.slice();
      if(method === 'random'){
        list.forEach((tm, i) => groups[i % g].ids.push(tm.id));
      } else {
        const sizes = groupSizes(list.length, g);
        let p = 0;
        sizes.forEach((s, i) => { groups[i].ids = list.slice(p, p + s).map(x => x.id); p += s; });
      }
    }
    return { groups, seeds: [] };
  }

  /* ------------------------------------------------------------------
     PRUEFUNG der Einstellungen vor dem Erstellen des Spielplans
     Liefert null oder { k: Fehlerschluessel, ... }
  ------------------------------------------------------------------ */
  function validate(t){
    const c = t.cfg;
    const active = t.teams.filter(x => x.act !== false);
    if(active.length < 2) return { k: 'errTeams' };
    if(c.mode === 'league'){
      if(!t.groups.length || t.groups[0].ids.length < 2) return { k: 'errTeams' };
      return null;
    }
    if(c.mode === 'ko' || c.mode === 'kids'){
      if(t.seeds.filter(id => !passive(t, id)).length < 2) return { k: 'errTeams' };
      return null;
    }
    if(!t.groups.length) return { k: 'errGroups' };
    if(t.groups.some(g => g.ids.length < 2)) return { k: 'errGroupSmall' };
    const minSize = Math.min.apply(null, t.groups.map(g => g.ids.length));
    if(c.adv < 1 || c.adv > minSize) return { k: 'errAdv', n: minSize };
    const nextRank = t.groups.filter(g => g.ids.length > c.adv).length;
    if(c.best > nextRank) return { k: 'errBest', n: nextRank };
    if(c.adv * t.groups.length + c.best < 2) return { k: 'errQual' };
    return null;
  }

  /* ------------------------------------------------------------------
     SPIELPLAN ERSTELLEN
  ------------------------------------------------------------------ */
  function build(t){
    const c = t.cfg;
    if(c.mode === 'kids'){
      t.matches = []; t.kids = { rounds: [] }; t.shift = {}; t.clock = null;
      kidsAdvance(t);
      return t;
    }
    const F = Math.max(1, c.fields | 0);
    const groupMatches = [];
    if(c.mode !== 'ko'){
      t.groups.forEach((g, gi) => {
        let rounds = roundRobin(g.ids);
        if(c.legs === 2) rounds = rounds.concat(rounds.map(r => r.map(p => [p[1], p[0]])));
        rounds.forEach((pairs, ri) => pairs.forEach(p => groupMatches.push({ id: UID(), ph: 'g', g: gi, rd: ri + 1, h: p[0], a: p[1], ref: null, res: null })));
      });
    }
    // Reihenfolge: Spieltag 1 aller Gruppen, dann Spieltag 2 ...
    const maxRd = groupMatches.reduce((m, x) => Math.max(m, x.rd), 0);
    const queue = [];
    for(let r = 1; r <= maxRd; r++) t.groups.forEach((_, gi) => groupMatches.filter(m => m.g === gi && m.rd === r).forEach(m => queue.push(m)));
    const slots = slotGroupPhase(queue, F);
    slots.forEach((sm, si) => sm.forEach((m, fi) => { m.slot = si; m.f = fi; }));

    // Finalrunde
    let ko = [];
    if(c.mode === 'ko'){
      ko = bracket(t.seeds.map((_, i) => ({ t: 's', i })), c.p3);
    } else if(c.mode === 'groups'){
      const entr = [];
      for(let r = 1; r <= c.adv; r++) t.groups.forEach((_, gi) => entr.push({ t: 'g', g: gi, r }));
      for(let i = 0; i < c.best; i++) entr.push({ t: 'x', r: c.adv + 1, i });
      const K = entr.length;
      const arranged = arrange(entr, nextPow2(K));
      ko = bracket(arranged, c.p3);
      // Platzierungsspiele (nur bei zwei Gruppen): A3-B3 um Platz 5 usw.
      if(c.place && t.groups.length === 2 && !c.best){
        const pl = [];
        const maxSize = Math.max(t.groups[0].ids.length, t.groups[1].ids.length);
        for(let r = c.adv + 1; r <= maxSize; r++){
          if(t.groups[0].ids.length >= r && t.groups[1].ids.length >= r){
            pl.push({ id: UID(), ph: 'ko', kr: 0, ks: 0, hs: { t: 'g', g: 0, r }, as: { t: 'g', g: 1, r },
                      lbl: { k: 'pl', p: K + 2 * (r - c.adv) - 1 }, ref: null, res: null });
          }
        }
        ko = pl.concat(ko);
      }
    }
    const firstKo = slots.length;
    slotKo(ko, F, firstKo);
    t.matches = groupMatches.slice().sort((a, b) => a.slot - b.slot || a.f - b.f).concat(ko);
    assignRefs(t);
    t.shift = {};
    t.clock = null;
    return t;
  }

  /* Gruppenphase auf Zeitfenster und Felder verteilen. Pro Zeitfenster
     hoechstens F Spiele, kein Team doppelt. Bevorzugt Teams, die im
     vorigen Fenster pausiert haben, und haelt sonst die Spieltagsfolge. */
  function slotGroupPhase(queue, F){
    const rest = queue.slice();
    const slots = [];
    let prev = new Set();
    while(rest.length){
      const used = new Set(), slot = [];
      while(slot.length < F){
        let best = -1, bestScore = Infinity;
        for(let i = 0; i < rest.length; i++){
          const m = rest[i];
          if(used.has(m.h) || used.has(m.a)) continue;
          const score = ((prev.has(m.h) ? 1 : 0) + (prev.has(m.a) ? 1 : 0)) * 1000 + i;
          if(score < bestScore){ bestScore = score; best = i; }
          if(score === i && i === 0) break;
        }
        if(best < 0) break;
        const m = rest.splice(best, 1)[0];
        slot.push(m); used.add(m.h); used.add(m.a);
      }
      slots.push(slot);
      prev = used;
    }
    return slots;
  }

  /* Setzliste so anordnen, dass in der ersten K.o.-Runde moeglichst keine
     zwei Teams aus derselben Gruppe aufeinandertreffen (A1-B2, B1-A2 ...). */
  function arrange(srcs, P){
    const K = srcs.length;
    const g0 = srcs.filter(s => s.t === 'g' && s.r === 1).length;
    const seeds = srcs.slice(0, g0), pool = srcs.slice(g0);
    const grp = s => s && s.t === 'g' ? s.g : null;
    let steps = 0;
    const conflict = (idx, s) => {
      const o = P + 1 - idx;
      if(o < idx && o <= K){ const a = grp(seeds[o - 1]), b = grp(s); return a != null && a === b; }
      return false;
    };
    const used = pool.map(() => false);
    function dfs(){
      if(seeds.length === K) return true;
      if(++steps > 20000) return false;
      const idx = seeds.length + 1;
      for(let i = 0; i < pool.length; i++){
        if(used[i] || conflict(idx, pool[i])) continue;
        used[i] = true; seeds.push(pool[i]);
        if(dfs()) return true;
        seeds.pop(); used[i] = false;
      }
      return false;
    }
    return dfs() ? seeds : srcs.slice();
  }

  function koLabel(R, n){
    if(R === 2) return { k: 'f' };
    if(R === 4) return { k: 'sf', n };
    if(R === 8) return { k: 'qf', n };
    if(R === 16) return { k: 'r16', n };
    return { k: 'rr', r: R, n };
  }
  /* K.o.-Baum aus gesetzten Quellen; fehlende Gegner = Freilos */
  function bracket(entrants, third){
    const K = entrants.length;
    if(K < 2) return [];
    const P = nextPow2(K);
    let cur = seedOrder(P).map(s => s <= K ? entrants[s - 1] : null);
    const out = [], semis = [];
    let R = P, kr = 1;
    while(cur.length > 1){
      const next = [];
      let n = 0;
      for(let i = 0; i < cur.length; i += 2){
        const a = cur[i], b = cur[i + 1];
        if(a && b){
          const m = { id: UID(), ph: 'ko', kr, ks: R, hs: a, as: b, lbl: koLabel(R, ++n), ref: null, res: null };
          out.push(m); next.push({ t: 'w', m: m.id });
          if(R === 4) semis.push(m);
        } else next.push(a || b || null);
      }
      cur = next; R /= 2; kr++;
    }
    if(third && semis.length === 2){
      const fin = out.pop();
      out.push({ id: UID(), ph: 'ko', kr: fin.kr, ks: 3, hs: { t: 'l', m: semis[0].id }, as: { t: 'l', m: semis[1].id }, lbl: { k: 'p3' }, ref: null, res: null });
      out.push(fin);
    }
    return out;
  }

  /* Finalrunde einplanen: ein Spiel fruehestens im Fenster nach seinen
     Vorgaengerspielen; das Finale bekommt ein eigenes, letztes Fenster. */
  function slotKo(ko, F, first){
    const slotOf = {}, fill = {};
    const deps = m => [m.hs, m.as].filter(s => s && (s.t === 'w' || s.t === 'l')).map(s => slotOf[s.m]);
    const finale = ko.find(m => m.lbl && m.lbl.k === 'f');
    ko.forEach(m => {
      if(m === finale) return;
      let s = Math.max(first, ...deps(m).map(x => x + 1));
      while((fill[s] || 0) >= F) s++;
      fill[s] = (fill[s] || 0) + 1;
      m.slot = s; m.f = fill[s] - 1; slotOf[m.id] = s;
    });
    if(finale){
      const used = Object.keys(fill).map(Number);
      const s = Math.max(first, ...deps(finale).map(x => x + 1), ...(used.length ? [Math.max(...used) + 1] : []));
      finale.slot = s; finale.f = 0; slotOf[finale.id] = s;
    }
  }

  /* Schiedsrichter fuer die Gruppenphase verteilen.
     cfg.refs: 'none' | 'teams' (pausierende Teams) | 'persons' (Liste) */
  function assignRefs(t){
    const c = t.cfg;
    t.matches.forEach(m => { m.ref = null; });
    if(c.refs === 'persons'){
      const names = (c.refList || []).filter(Boolean);
      if(!names.length) return;
      const cnt = {};
      bySlot(t.matches).forEach(sm => {
        const busy = new Set();
        sm.forEach(m => {
          const free = names.filter(n => !busy.has(n)).sort((a, b) => (cnt[a] || 0) - (cnt[b] || 0));
          if(!free.length) return;
          m.ref = { t: 'p', n: free[0] }; busy.add(free[0]); cnt[free[0]] = (cnt[free[0]] || 0) + 1;
        });
      });
      return;
    }
    if(c.refs !== 'teams') return;
    const active = t.teams.filter(x => x.act !== false).map(x => x.id);
    const groupOf = {};
    t.groups.forEach((g, gi) => g.ids.forEach(id => { groupOf[id] = gi; }));
    const cnt = {};
    const slots = bySlot(t.matches.filter(m => m.ph === 'g'));
    const plays = slots.map(sm => new Set([].concat(...sm.map(m => [m.h, m.a]))));
    slots.forEach((sm, si) => {
      const busy = new Set(plays[si]);
      sm.forEach(m => {
        let best = null, bs = Infinity;
        active.forEach(id => {
          if(busy.has(id)) return;
          const s = (cnt[id] || 0) * 10 + (groupOf[id] === m.g ? 0 : 4) +
                    (plays[si + 1] && plays[si + 1].has(id) ? 2 : 0) + (plays[si - 1] && plays[si - 1].has(id) ? 0 : 1);
          if(s < bs){ bs = s; best = id; }
        });
        if(best){ m.ref = { t: 't', id: best }; busy.add(best); cnt[best] = (cnt[best] || 0) + 1; }
      });
    });
  }
  function bySlot(ms){
    const out = [];
    ms.forEach(m => { (out[m.slot] = out[m.slot] || []).push(m); });
    for(let i = 0; i < out.length; i++) out[i] = (out[i] || []).sort((a, b) => a.f - b.f);
    return out;
  }

  /* ------------------------------------------------------------------
     ZEITEN
     Anstoss je Zeitfenster in Minuten ab Mitternacht.
     t.shift = { fenster: minuten } verschiebt ab diesem Fenster (Verzug).
  ------------------------------------------------------------------ */
  const parseTime = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || '')); return m ? (+m[1]) * 60 + (+m[2]) : 600; };
  function slotCount(t){
    const n = t.matches.reduce((k, m) => Math.max(k, m.slot + 1), 0);
    return t.cfg.mode === 'kids' ? Math.max(n, t.cfg.kRounds | 0) : n;
  }
  function slotTimes(t){
    const c = t.cfg, n = slotCount(t);
    const isKo = [];
    t.matches.forEach(m => { if(m.ph === 'ko') isKo[m.slot] = true; });
    const out = [];
    let cur = parseTime(c.start);
    for(let s = 0; s < n; s++){
      if(s > 0){
        cur += dur(c, !!isKo[s - 1]) + (c.brk | 0);
        if(isKo[s] && !isKo[s - 1]) cur += (c.koPause | 0);
      }
      cur += (t.shift && t.shift[s]) | 0;
      out.push({ start: cur, dur: dur(c, !!isKo[s]), ko: !!isKo[s] });
    }
    return out;
  }
  const dur = (c, ko) => Math.max(1, (ko ? c.koDur : c.dur) | 0);
  const fmtTime = min => { const m = ((Math.round(min) % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };

  /* ------------------------------------------------------------------
     AUSWERTUNG
  ------------------------------------------------------------------ */
  const isSets = c => c.score === 'sets';
  function outcome(c, res){
    // Ergebnis -> { h, a (Tore bzw. Saetze), ph, pa (Baelle), win }
    if(!res) return null;
    if(res.wo === 'h' || res.wo === 'a') return { h: 0, a: 0, ph: 0, pa: 0, win: res.wo, wo: true };
    // Kindermodus ohne Tore: nur "wer hat gewonnen" (kw = 'h' | 'a' | 'd')
    if(res.kw === 'h' || res.kw === 'a' || res.kw === 'd') return { h: 0, a: 0, ph: 0, pa: 0, win: res.kw === 'd' ? null : res.kw, quick: true };
    let h, a, ph, pa;
    if(isSets(c)){
      h = 0; a = 0; ph = 0; pa = 0;
      (res.sets || []).forEach(s => {
        if(!s || s[0] == null || s[1] == null) return;
        ph += +s[0]; pa += +s[1];
        if(+s[0] > +s[1]) h++; else if(+s[1] > +s[0]) a++;
      });
    } else { h = +res.h || 0; a = +res.a || 0; ph = h; pa = a; }
    let win = h > a ? 'h' : a > h ? 'a' : null, dec = false;
    if(!win && (res.dec === 'h' || res.dec === 'a')){ win = res.dec; dec = true; }
    return { h, a, ph, pa, win, dec };
  }
  const passive = (t, id) => { const x = t.teams.find(y => y.id === id); return !x || x.act === false; };

  /* Alles auf einmal berechnen: Teams je Spiel, Status, Tabellen, Endstand. */
  function analyze(t){
    const c = t.cfg;
    const A = { teams: {}, st: {}, out: {}, tables: [], groupDone: [], allGroupsDone: true, rank: [], rankDone: false };
    const byId = {};
    t.matches.forEach(m => { byId[m.id] = m; });
    const crit = ['pts'].concat((c.tb || []).filter(k => k !== 'pts'));

    function evalMatch(m){
      const direct = m.ph === 'g' || m.ph === 'k';
      const h = m.oh || (direct ? m.h : resolve(m.hs));
      const a = m.oa || (direct ? m.a : resolve(m.as));
      A.teams[m.id] = [h || null, a || null];
      let o = outcome(c, m.res), st;
      if(o) st = 'done';
      else if(h && a && (passive(t, h) || passive(t, a))){
        if(direct || (passive(t, h) && passive(t, a))) st = 'void';
        else { st = 'wo'; o = { h: 0, a: 0, ph: 0, pa: 0, win: passive(t, h) ? 'a' : 'h', wo: true, auto: true }; }
      } else st = h && a ? 'open' : 'wait';
      A.st[m.id] = st; A.out[m.id] = o;
    }
    function resolve(s){
      if(!s) return null;
      if(s.t === 's') return t.seeds[s.i] || null;
      if(s.t === 'g'){ if(!A.groupDone[s.g]) return null; const r = A.tables[s.g][s.r - 1]; return r ? r.id : null; }
      if(s.t === 'x'){ if(!A.allGroupsDone) return null; const l = across(s.r); return l[s.i] || null; }
      if(s.t === 'w' || s.t === 'l'){
        const o = A.out[s.m], tm = A.teams[s.m];
        if(!o || !o.win || !tm) return null;
        const w = o.win === 'h' ? tm[0] : tm[1], l = o.win === 'h' ? tm[1] : tm[0];
        return s.t === 'w' ? w : l;
      }
      return null;
    }
    // 0) Kindermodus: Leiter statt Gruppen
    if(c.mode === 'kids'){
      t.matches.forEach(evalMatch);
      kidsTable(t, A);
      const counted = t.matches.filter(m => A.st[m.id] !== 'void');
      A.total = Math.max(counted.length, (c.kRounds | 0) * kidsFields(c, t.seeds.filter(id => !passive(t, id)).length));
      A.played = counted.filter(m => A.st[m.id] === 'done').length;
      A.stats = stats(t, A);
      return A;
    }
    // 1) Gruppenphase
    t.matches.filter(m => m.ph === 'g').forEach(evalMatch);
    t.groups.forEach((g, gi) => {
      const ms = t.matches.filter(m => m.ph === 'g' && m.g === gi);
      A.tables[gi] = table(t, g, ms, A, crit);
      A.groupDone[gi] = ms.length > 0 && ms.every(m => A.st[m.id] !== 'open' && A.st[m.id] !== 'wait');
      if(!A.groupDone[gi]) A.allGroupsDone = false;
    });
    if(!t.groups.length) A.allGroupsDone = true;
    function across(r){
      const rows = [];
      A.tables.forEach(tb => { if(tb[r - 1]) rows.push(tb[r - 1]); });
      const per = (x, k) => x.p ? x[k] / x.p : 0;
      return rows.slice().sort((x, y) => per(y, 'pts') - per(x, 'pts') || per(y, 'diffv') - per(x, 'diffv') || per(y, 'gf') - per(x, 'gf')).map(x => x.id);
    }
    A.across = across;
    // 2) Finalrunde in Erstellungsreihenfolge (Vorgaenger kommen zuerst)
    t.matches.filter(m => m.ph === 'ko').forEach(evalMatch);
    A.resolve = resolve;
    // 3) Fortschritt
    const counted = t.matches.filter(m => A.st[m.id] !== 'void');
    A.total = counted.length;
    A.played = counted.filter(m => A.st[m.id] === 'done' || A.st[m.id] === 'wo').length;
    // 4) Endstand
    ranking(t, A);
    A.stats = stats(t, A);
    return A;
  }

  /* Tabelle einer Gruppe */
  function table(t, g, ms, A, crit){
    const c = t.cfg, sets = isSets(c);
    const rows = g.ids.map((id, i) => ({ id, i, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, sw: 0, sl: 0, pts: 0, diffv: 0, passive: passive(t, id) }));
    const by = {};
    rows.forEach(r => { by[r.id] = r; });
    const played = ms.filter(m => (A.st[m.id] === 'done' || A.st[m.id] === 'wo') && by[m.h] && by[m.a]);
    played.forEach(m => applyRes(c, by[m.h], by[m.a], A.out[m.id]));
    rows.forEach(r => { r.diffv = sets ? r.sw - r.sl : r.gf - r.ga; });
    // Passive (ausgefallene) Teams stehen immer am Ende und koennen sich
    // nicht fuer die Finalrunde qualifizieren.
    const ranked = rankRows(rows, crit, played, A, c);
    const sorted = ranked.filter(r => !r.passive).concat(ranked.filter(r => r.passive));
    sorted.forEach((r, i) => { r.pos = i + 1; });
    return sorted;
  }
  function applyRes(c, H, Aw, o){
    H.p++; Aw.p++;
    if(!o.wo){ H.gf += o.ph; H.ga += o.pa; Aw.gf += o.pa; Aw.ga += o.ph; H.sw += o.h; H.sl += o.a; Aw.sw += o.a; Aw.sl += o.h; }
    if(o.win === 'h'){ H.w++; Aw.l++; H.pts += +c.pW; Aw.pts += +c.pL; }
    else if(o.win === 'a'){ Aw.w++; H.l++; Aw.pts += +c.pW; H.pts += +c.pL; }
    else { H.d++; Aw.d++; H.pts += +c.pD; Aw.pts += +c.pD; }
  }
  /* Sortieren nach Kriterien; Gleichstaende werden mit dem naechsten
     Kriterium aufgeloest. 'h2h' = direkter Vergleich nur unter den
     (noch) punktgleichen Teams. Bleibt alles gleich: r.tie = true. */
  function rankRows(rows, crit, played, A, c){
    if(rows.length < 2) return rows;
    if(!crit.length){ rows.forEach(r => { r.tie = true; }); return rows.sort((a, b) => a.i - b.i); }
    const k = crit[0], rest = crit.slice(1);
    const sets = isSets(c);
    let key;
    if(k === 'h2h'){
      const ids = new Set(rows.map(r => r.id));
      const mini = {};
      rows.forEach(r => { mini[r.id] = { id: r.id, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, sw: 0, sl: 0, pts: 0 }; });
      played.filter(m => ids.has(m.h) && ids.has(m.a)).forEach(m => applyRes(c, mini[m.h], mini[m.a], A.out[m.id]));
      key = r => { const x = mini[r.id]; return [x.pts, sets ? x.sw - x.sl : x.gf - x.ga, x.gf]; };
    } else if(k === 'pts') key = r => [r.pts];
    else if(k === 'diff') key = r => [sets ? r.sw - r.sl : r.gf - r.ga];
    else if(k === 'pdiff') key = r => [r.gf - r.ga];
    else if(k === 'for') key = r => [r.gf];
    else if(k === 'wins') key = r => [r.w];
    else key = () => [0];
    const keys = new Map(rows.map(r => [r, key(r)]));
    const cmp = (a, b) => { const x = keys.get(a), y = keys.get(b); for(let i = 0; i < x.length; i++){ if(y[i] !== x[i]) return y[i] - x[i]; } return 0; };
    const s = rows.slice().sort((a, b) => cmp(a, b) || a.i - b.i);
    const out = [];
    for(let i = 0; i < s.length;){
      let j = i + 1;
      while(j < s.length && cmp(s[i], s[j]) === 0) j++;
      const block = s.slice(i, j);
      if(block.length > 1){
        // Direkter Vergleich muss bei jedem neuen Teilblock neu gerechnet werden
        out.push.apply(out, rankRows(block, rest, played, A, c));
      } else out.push(block[0]);
      i = j;
    }
    return out;
  }

  /* Endstand. Liefert A.rank = [{ pos, id }] (geteilte Plaetze moeglich)
     und A.rankDone, wenn alle Plaetze feststehen. */
  function ranking(t, A){
    const c = t.cfg;
    const rank = [];
    if(c.mode === 'league'){
      const tb = A.tables[0] || [];
      tb.forEach(r => rank.push({ pos: r.pos, id: r.id }));
      A.rank = rank; A.rankDone = A.groupDone[0] === true;
      return;
    }
    const ko = t.matches.filter(m => m.ph === 'ko');
    const fin = ko.find(m => m.lbl && m.lbl.k === 'f');
    const p3 = ko.find(m => m.lbl && m.lbl.k === 'p3');
    const placed = new Set();
    let done = true;
    const put = (pos, id) => { if(id && !placed.has(id)){ rank.push({ pos, id }); placed.add(id); } };
    const wl = m => {
      const o = A.out[m.id], tm = A.teams[m.id];
      if(!o || !o.win || !tm) return null;
      return o.win === 'h' ? [tm[0], tm[1]] : [tm[1], tm[0]];
    };
    if(fin){ const r = wl(fin); if(r){ put(1, r[0]); put(2, r[1]); } else done = false; }
    if(p3){ const r = wl(p3); if(r){ put(3, r[0]); put(4, r[1]); } else done = false; }
    // Ausgeschiedene der K.o.-Runden teilen sich den Platz
    const rounds = ko.filter(m => m.kr > 0 && m.lbl.k !== 'f' && m.lbl.k !== 'p3').sort((a, b) => b.kr - a.kr);
    rounds.forEach(m => {
      const r = wl(m);
      if(!r){ done = false; return; }
      if(m.ks === 4 && p3) return; // Halbfinal-Verlierer spielen um Platz 3
      put(m.ks / 2 + 1, r[1]);
    });
    if(!fin && ko.some(m => m.kr > 0)) done = false;
    let K = 0;
    if(c.mode === 'ko') K = t.seeds.length;
    if(c.mode === 'groups'){
      K = c.adv * t.groups.length + c.best;
      const pl = ko.filter(m => m.lbl && m.lbl.k === 'pl');
      pl.forEach(m => { const r = wl(m); if(r){ put(m.lbl.p, r[0]); put(m.lbl.p + 1, r[1]); } else done = false; });
      if(!A.allGroupsDone) done = false;
      // Uebrige nach Gruppenrang, innerhalb des Rangs gruppenuebergreifend
      let pos = K + 1 + pl.length * 2;
      const maxSize = Math.max(0, ...t.groups.map(g => g.ids.length));
      for(let r = c.adv + 1; r <= maxSize; r++){
        if(!A.allGroupsDone) break;
        A.across(r).forEach(id => { if(!placed.has(id)){ put(pos, id); pos++; } });
      }
    }
    rank.sort((a, b) => a.pos - b.pos);
    A.rank = rank; A.rankDone = done && rank.length > 0;
  }


  /* ------------------------------------------------------------------
     KINDERFUSSBALL – Leiter ueber die Felder ("Champions-League-System")
     t.kids.rounds[r] = { lad: Leiter zu Rundenbeginn (beste zuerst),
                          rest: pausierende Teams dieser Runde }
     Feld 1 = Leiterplaetze 1+2 der spielenden Teams, Feld 2 = 3+4 ...
     Sieger ruecken ein Feld hoch, Verlierer eins runter; bei
     Unentschieden bleiben beide (oder Entscheidung, cfg.kDraw = 'dec').
     Bei ungerader Zahl bzw. zu wenigen Feldern pausieren Teams reihum;
     sie behalten ihren Platz auf der Leiter.
  ------------------------------------------------------------------ */
  const kidsFields = (c, n) => Math.max(1, Math.min(Math.max(1, c.fields | 0), Math.floor(n / 2)));
  function kidsMove(t, round, ms){
    const c = t.cfg, rest = new Set(round.rest);
    const playing = round.lad.filter(id => !rest.has(id));
    const F = Math.floor(playing.length / 2), L = F - 1;
    const info = {};
    for(let i = 0; i < F; i++){
      const h = playing[2 * i], a = playing[2 * i + 1];
      const m = ms.find(x => (x.h === h && x.a === a) || (x.h === a && x.a === h));
      const o = m ? outcome(c, m.res) : null;
      let wh = 0;   // 1 = h gewinnt, -1 = a gewinnt, 0 = bleibt
      if(o && o.win) wh = (o.win === 'h') === (m.h === h) ? 1 : -1;
      info[h] = { f: i, tgt: wh > 0 ? Math.max(0, i - 1) : wh < 0 ? Math.min(L, i + 1) : i, r: wh > 0 ? 0 : wh < 0 ? 2 : 1 };
      info[a] = { f: i, tgt: wh < 0 ? Math.max(0, i - 1) : wh > 0 ? Math.min(L, i + 1) : i, r: wh < 0 ? 0 : wh > 0 ? 2 : 1 };
    }
    const order = playing.filter(id => info[id]).sort((x, y) => info[x].tgt - info[y].tgt || info[x].f - info[y].f || info[x].r - info[y].r);
    // ein uebrig gebliebenes Team (ungerade, ohne Spiel) bleibt am Ende
    playing.filter(id => !info[id]).forEach(id => order.push(id));
    const out = round.lad.slice();
    let k = 0;
    out.forEach((id, i) => { if(!rest.has(id)) out[i] = order[k++]; });
    return out;
  }
  function kidsRest(t, lad, roundIdx){
    const c = t.cfg, n = lad.length, R = n - 2 * kidsFields(c, n);
    if(R <= 0) return [];
    const cnt = {}, last = {};
    (t.kids.rounds || []).slice(0, roundIdx).forEach((r, ri) => r.rest.forEach(id => { cnt[id] = (cnt[id] || 0) + 1; last[id] = ri; }));
    return lad.map((id, i) => ({ id, i })).sort((x, y) => ((cnt[x.id] || 0) - (cnt[y.id] || 0)) ||
      ((last[x.id] == null ? -1 : last[x.id]) - (last[y.id] == null ? -1 : last[y.id])) || (y.i - x.i)).slice(0, R).map(x => x.id);
  }
  function kidsRoundMatches(t, ri){ return t.matches.filter(m => m.ph === 'k' && m.rd === ri + 1); }
  function kidsRoundDone(t, ri){
    const ms = kidsRoundMatches(t, ri);
    return ms.length > 0 && ms.every(m => m.res || passive(t, m.h) || passive(t, m.a));
  }
  /* naechste Runde erzeugen, wenn die letzte fertig ist */
  function kidsAdvance(t){
    const c = t.cfg;
    t.kids = t.kids || { rounds: [] };
    const K = t.kids.rounds;
    let added = 0;
    while(K.length < (c.kRounds | 0)){
      const r = K.length;
      if(r > 0 && !kidsRoundDone(t, r - 1)) break;
      const base = r === 0 ? t.seeds : kidsMove(t, K[r - 1], kidsRoundMatches(t, r - 1));
      const lad = base.filter(id => !passive(t, id));
      if(lad.length < 2) break;
      const rest = kidsRest(t, lad, r);
      K.push({ lad, rest });
      const playing = lad.filter(id => rest.indexOf(id) === -1);
      const F = Math.floor(playing.length / 2);
      for(let i = 0; i < F; i++){
        t.matches.push({ id: UID(), ph: 'k', rd: r + 1, slot: r, f: i, h: playing[2 * i], a: playing[2 * i + 1], ref: null, res: null });
      }
      kidsRefs(t, r);
      added++;
      break; // immer nur eine Runde im Voraus
    }
    return added;
  }
  function kidsRefs(t, r){
    const c = t.cfg, ms = kidsRoundMatches(t, r), rest = t.kids.rounds[r].rest.slice();
    if(c.refs === 'teams') ms.forEach((m, i) => { m.ref = rest[i] ? { t: 't', id: rest[i] } : null; });
    else if(c.refs === 'persons'){
      const names = (c.refList || []).filter(Boolean);
      if(!names.length) return;
      ms.forEach((m, i) => { const n = names[(r * ms.length + i) % names.length]; m.ref = ms.length <= names.length ? { t: 'p', n } : (i < names.length ? { t: 'p', n: names[i] } : null); });
    }
  }
  /* Nach Aenderung eines frueheren Ergebnisses: stimmen die spaeteren
     Runden noch? Sonst ab dort neu auslosen. Liefert die Zahl der
     dadurch verworfenen Ergebnisse. */
  function kidsSync(t){
    if(t.cfg.mode !== 'kids' || !t.kids) return 0;
    const K = t.kids.rounds;
    let lost = 0;
    for(let r = 1; r < K.length; r++){
      const exp = kidsMove(t, K[r - 1], kidsRoundMatches(t, r - 1)).filter(id => K[r].lad.indexOf(id) !== -1);
      const prevDone = kidsRoundDone(t, r - 1);
      if(!prevDone || exp.join() !== K[r].lad.join()){
        t.matches = t.matches.filter(m => {
          if(m.ph === 'k' && m.rd > r){ if(m.res) lost++; return false; }
          return true;
        });
        K.length = r;
        break;
      }
    }
    if(K.length > (t.cfg.kRounds | 0)){
      t.matches = t.matches.filter(m => { if(m.ph === 'k' && m.rd > t.cfg.kRounds){ if(m.res) lost++; return false; } return true; });
      K.length = t.cfg.kRounds | 0;
    }
    kidsAdvance(t);
    return lost;
  }
  /* Tabelle und Endstand im Kindermodus */
  function kidsTable(t, A){
    const c = t.cfg, K = (t.kids && t.kids.rounds) || [];
    const ids = t.seeds.slice();
    const rows = {};
    ids.forEach((id, i) => { rows[id] = { id, i, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, sw: 0, sl: 0, pts: 0, diffv: 0, rest: 0, passive: passive(t, id) }; });
    K.forEach(r => r.rest.forEach(id => { if(rows[id]) rows[id].rest++; }));
    t.matches.forEach(m => { if(A.st[m.id] === 'done' && rows[m.h] && rows[m.a]) applyRes(c, rows[m.h], rows[m.a], A.out[m.id]); });
    Object.keys(rows).forEach(id => { const r = rows[id]; r.diffv = r.gf - r.ga; });
    // aktuelle Leiter: nach der letzten fertigen Runde
    let lad = K.length ? K[K.length - 1].lad.slice() : t.seeds.filter(id => !passive(t, id));
    const lastDone = K.length && kidsRoundDone(t, K.length - 1);
    if(lastDone) lad = kidsMove(t, K[K.length - 1], kidsRoundMatches(t, K.length - 1));
    const all = lad.filter(id => !passive(t, id)).concat(ids.filter(id => lad.indexOf(id) === -1 || passive(t, id)).filter((id, i, a) => a.indexOf(id) === i));
    A.ladder = lad.filter(id => !passive(t, id));
    A.tables = [all.filter(id => rows[id]).map((id, i) => Object.assign(rows[id], { pos: i + 1 }))];
    A.groupDone = [K.length >= (c.kRounds | 0) && !!lastDone];
    A.allGroupsDone = A.groupDone[0];
    A.rank = A.tables[0].filter(r => !r.passive).map(r => ({ pos: r.pos, id: r.id }));
    A.rankDone = A.groupDone[0];
    A.kidsRounds = K;
  }

  /* ------------------------------------------------------------------
     STATISTIK: Torschuetzen und Fair-Play aus den Spielereignissen
     m.ev = [{ id, k:'goal'|'pen'|'og'|'y'|'tp'|'r', s:'h'|'a', p, n, min }]
     Fair-Play-Punkte: Gelb 1, Zeitstrafe 2, Rot 3 (weniger = fairer)
  ------------------------------------------------------------------ */
  function stats(t, A){
    const sc = {}, fp = {};
    t.teams.forEach(e => { fp[e.id] = { id: e.id, y: 0, tp: 0, r: 0, pts: 0 }; });
    t.matches.forEach(m => {
      const tm = A.teams[m.id];
      if(!tm || !Array.isArray(m.ev) || A.st[m.id] === 'void') return;
      m.ev.forEach(e => {
        const team = e.s === 'h' ? tm[0] : tm[1];
        if(!team) return;
        if(e.k === 'goal' || e.k === 'pen'){
          const key = team + '|' + (e.p || e.n || '?');
          const x = sc[key] = sc[key] || { team, p: e.p || null, n: e.n || '', goals: 0, pens: 0 };
          x.goals++; if(e.k === 'pen') x.pens++;
        }
        if(fp[team] && (e.k === 'y' || e.k === 'tp' || e.k === 'r')){
          fp[team][e.k]++; fp[team].pts += e.k === 'y' ? 1 : e.k === 'tp' ? 2 : 3;
        }
      });
    });
    const scorers = Object.keys(sc).map(k => sc[k]).filter(x => x.n).sort((a, b) => b.goals - a.goals || a.n.localeCompare(b.n));
    const fair = Object.keys(fp).map(k => fp[k]).sort((a, b) => a.pts - b.pts || a.r - b.r);
    return { scorers, fair, anyCards: fair.some(x => x.pts > 0) };
  }

  return {
    setRandom(f){ RNG = f; }, setUid(f){ UID = f; },
    kidsAdvance, kidsSync, kidsFields, stats,
    roundRobin, seedOrder, draw, validate, build, assignRefs, slotTimes, slotCount, fmtTime, parseTime,
    analyze, outcome, bySlot, isSets, GROUP_NAMES
  };
})();

}
function renderNow(resetScroll){
  const fe = document.activeElement;
  if(fe && fe !== document.body && $('view').contains(fe)) fe.blur();
  let r = cur();
  // Verweis auf geloeschtes Turnier/Team: zurueck zur Startseite

    STACK = [{ v: 'home' }]; r = cur();
  }

  let html = '', wide = false;
  if(r.v === 'home') html = viewHome();
  else if(r.v === 'teams') html = viewTeams();
  else if(r.v === 'team') html = viewTeam(r);
  else if(r.v === 'setup') html = viewSetup(r);

  else if(r.v === 'tour'){ html = viewTour(r); wide = r.tab !== 'clock'; }

  const beam = r.v === 'beamer';
  $('top').style.display = beam ? 'none' : '';

  if(!beam && (document.fullscreenElement || document.webkitFullscreenElement)){ try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch(e){} }
  view.innerHTML = '<div class="wrap' + (wide ? ' wide' : '') + '">' + html + '</div>';
  view.scrollTop = resetScroll ? 0 : keep;
  if(r.v === 'tour' && r.tab === 'clock') tick();
}

/* Probelauf: wie viele Spiele, Runden und wie lange? */
function estimate(x){
  const clone = { cfg: x.cfg, teams: x.teams, groups: [], seeds: [], matches: [] };
  if(built(x)){ clone.groups = x.groups; clone.seeds = x.seeds; clone.matches = x.matches; clone.shift = x.shift; }
  else {
    const d = Engine.draw(x.teams, Object.assign({}, x.cfg, { seed: 'manual' }));
    clone.groups = d.groups; clone.seeds = d.seeds;
    const err = Engine.validate(clone);
    if(err) return { err };
    Engine.build(clone);
  }
  const times = Engine.slotTimes(clone);
  if(!times.length) return { err: { k: 'errTeams' } };
  const last = times[times.length - 1];
  if(x.cfg.mode === 'kids') return { matches: x.cfg.kRounds * Engine.kidsFields(x.cfg, clone.seeds.length), slots: times.length, from: times[0].start, to: last.start + last.dur };
  return { matches: clone.matches.length, slots: times.length, from: times[0].start, to: last.start + last.dur, groups: clone.groups };
}

}

/* aktuelles Zeitfenster = erstes mit offenen Spielen */
function currentSlot(x, A){
  const n = Engine.slotCount(x);
  for(let s = 0; s < n; s++){
    if(x.matches.some(m => m.slot === s && (A.st[m.id] === 'open' || A.st[m.id] === 'wait'))) return s;
  }
  return n - 1;
}
function slotTitle(x, s, A){
  const t = T();
  const ms = x.matches.filter(m => m.slot === s);
  if(ms.length && ms.every(m => m.ph === 'ko')){
    const labels = [];
    ms.forEach(m => { const l = m.lbl.k === 'sf' ? t.semis : m.lbl.k === 'qf' ? t.quarters : m.lbl.k === 'r16' ? t.r16s : matchLabel(m); if(labels.indexOf(l) === -1) labels.push(l); });
    return labels.join(' · ');
  }
  return t.roundN(s + 1);
}
function viewPlan(x, r){

    '<div class="prog"><i style="width:' + pct + '%"></i></div></div>';
  const slots = Engine.bySlot(x.matches);
  const kids = x.cfg.mode === 'kids', K = (x.kids && x.kids.rounds) || [];
  if(kids) for(let s = slots.length; s < times.length; s++) slots[s] = [];

  if(o.wo) return o.win === 'h' ? '+:–' : '–:+';
  let s = o.h + ':' + o.a;
  if(withSets && x.cfg.score === 'sets' && m.res && m.res.sets) s += ' (' + m.res.sets.map(z => z[0] + ':' + z[1]).join(', ') + ')';
  return s;

    '<div class="info">' + esc(sub.filter(Boolean).join(' · ')) + '</div></div></button>';

/* ----- Turnieruhr ----- */
function clockOf(x){
  if(!x.clock){
    const A = ana(x);
    x.clock = { s: Math.max(0, currentSlot(x, A)), el: 0, since: null, add: 0, f60: false, f0: false };
  }
  return x.clock;
}
function clockDurMs(x, k){ const times = Engine.slotTimes(x); const tm = times[k.s] || times[0]; return ((tm ? tm.dur : x.cfg.dur) * 60 + k.add) * 1000; }
const clockEl = (k, now) => k.el + (k.since ? Math.max(0, now - k.since) : 0);
function fmtMs(ms){
  const neg = ms < 0; ms = Math.abs(ms);
  const s = Math.floor(ms / 1000);
  return (neg ? '+' : '') + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function viewClock(x){
  const t = T(), A = ana(x), k = clockOf(x), times = Engine.slotTimes(x), n = times.length;
  if(k.s >= n) k.s = n - 1;
  const tm = times[k.s];
  const ms = x.matches.filter(m => m.slot === k.s).sort((a, b) => a.f - b.f);
  let h = '<div class="clockbox"><div class="rd"><button data-act="clkSlot" data-d="-1"' + (k.s <= 0 ? ' disabled' : '') + ' aria-label="‹">‹</button>' +
    '<div class="rdt">' + esc(slotTitle(x, k.s, A)) + '<small>' + esc(t.plannedAt(Engine.fmtTime(tm.start), tm.dur)) + '</small></div>' +
    '<button data-act="clkSlot" data-d="1"' + (k.s >= n - 1 ? ' disabled' : '') + ' aria-label="›">›</button></div>' +
    '<div id="clk" class="num">--:--</div><div id="clkst"></div>' +
    '<div class="cctl"><button class="btn alt" data-act="clkAdj" data-d="-60">−1</button>' +
    '<button class="btn main" data-act="clkToggle" id="clkbtn">' + (k.since ? '⏸ ' + esc(t.pause) : '▶ ' + esc(k.el ? t.resume : t.start)) + '</button>' +
    '<button class="btn alt" data-act="clkAdj" data-d="60">+1</button></div>' +
    '<div class="cctl" style="margin-top:8px"><button class="btn alt" style="flex:1" data-act="clkReset">↺ ' + esc(t.reset) + '</button>' +
    '<button class="btn alt" style="flex:2" data-act="clkNext"' + (k.s >= n - 1 ? ' disabled' : '') + '>' + esc(t.nextRound) + ' ›</button></div></div>';
  // Verzug
  const late = lateness(x, k, times);
  if(late) h += '<div class="warn" style="margin-top:12px">' + esc(t.lateText(late)) +
    '<button class="btn sm" data-act="applyShift" data-d="' + late + '" style="margin-top:8px;background:var(--amber);color:#1a1a1a">' + esc(t.lateBtn(late)) + '</button></div>';
  h += sec(t.matchesNow) + '<div class="slot">' + (ms.length ? ms.map(m => matchRowHtml(x, m, A)).join('') : '<div class="empty" style="padding:12px 14px">' + esc(t.kidsLater) + '</div>') + '</div>';
  h += penaltiesHtml(x, k.s);
  h += toggle(t.soundOn, t.soundSub, 'cfgToggle', x.cfg.sound, ' data-k="sound"') +
    '<button class="btn ghost sm" data-act="soundTest" style="margin-top:8px">🔊 ' + esc(t.soundTest) + ' · ' + esc(t['snd_' + DB.prefs.snd]) + '</button>' +
    '<div class="hint">' + esc(t.clockHint) + '</div>';
  return h;
}
/* Wie viele Minuten liegt das Turnier hinter dem Plan? Nur am Turniertag,
   nur vor dem Start der Runde, ab 3 Minuten. */
function lateness(x, k, times){
  if(x.date !== todayStr() || k.el || k.since || x.done) return 0;
  const d = new Date(), now = d.getHours() * 60 + d.getMinutes();
  const diff = now - times[k.s].start;
  return diff >= 3 && diff < 240 ? diff : 0;
}

/* =====================================================================
   ERGEBNISSE UND ABHAENGIGKEITEN
   Jedes Ergebnis der Finalrunde merkt sich, fuer welche zwei Teams es
   eingetragen wurde (res.t). Aendert sich spaeter ein Gruppen- oder
   Vorrundenergebnis so, dass dort andere Teams stehen, ist es veraltet
   und wird – nach Rueckfrage – geloescht.
   ===================================================================== */
function clearStale(x){
  let n = 0;
  for(let loop = 0; loop < 20; loop++){
    const A = Engine.analyze(x);
    const stale = x.matches.filter(m => m.ph === 'ko' && m.res && m.res.t &&
      (m.res.t[0] !== A.teams[m.id][0] || m.res.t[1] !== A.teams[m.id][1]));
    if(!stale.length) break;
    stale.forEach(m => { m.res = null; n++; });
  }
  return n;
}
function commit(x, mutate, after){
  const probe = JSON.parse(JSON.stringify(x));
  mutate(probe);
  // Finalrunde: veraltete Ergebnisse; Kindermodus: Folgerunden, die neu ausgelost werden
  const n = clearStale(probe) + Engine.kidsSync(probe);
  const run = () => { mutate(x); clearStale(x); Engine.kidsSync(x); save(); closeSheet(); render(false); if(after) after(); };
  if(n) askConfirm(T().staleTitle, T().staleText(n), T().continueBtn, run);
  else run();
}

let wakeLock = null, awakeNative = null;
async function keepAwake(on){
  const ins = window.plugins && window.plugins.insomnia;
  if(ins){
    if(awakeNative !== on){ awakeNative = on; try { on ? ins.keepAwake() : ins.allowSleepAgain(); } catch(e){} }
    return;
  }
  try {
    if(on && !wakeLock && navigator.wakeLock && document.visibilityState === 'visible'){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });

  } catch(e){ wakeLock = null; }

let audioCtx = null;
/* iOS spielt Ton erst nach einer Beruehrung ab: AudioContext beim ersten

function unlockAudio(){

/* ----- Signaltoene -----
   Alle Klaenge werden im Geraet erzeugt (keine Audiodateien). Je Set drei

  g.gain.setValueAtTime(vol, Math.max(t0 + (att || 0.02), t0 + len - (rel || 0.08)));

  const lfoG = audioCtx.createGain(); lfoG.gain.value = 0.35; lfo.connect(lfoG); lfoG.connect(trill.gain);

/* tiefes Schiffshorn / Stadionhorn */
function shipHorn(start, len){

  const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700; lp.Q.value = 1.2;

/* Druckluft-Fanfare */
function airHorn(start, len){
  const t0 = audioCtx.currentTime + start;

function fanfare(){

}

function tick(){
  const now = Date.now();
  let running = false;
  DB.tours.forEach(x => {
    const k = x.clock;
    if(!k || !k.since) return;
    running = true;
    const rem = clockDurMs(x, k) - clockEl(k, now);
    // Verspaetet bemerkte Signale (App war im Hintergrund, die Benachrichtigung
    // kam schon) nicht nachtraeglich abspielen.
    if(!k.f60 && rem <= 60000 && rem > 0 && clockDurMs(x, k) > 90000){ k.f60 = true; save(); if(x.cfg.sound && rem > 55000) signal('warn'); }
    if(!k.f0 && rem <= 0){ k.f0 = true; save(); if(rem > -5000){ if(x.cfg.sound) signal('end'); else vibrate([600, 200, 600]); } }
  });
  keepAwake(running || cur().v === 'beamer');
  tickExtras(now);
  const r = cur();
  if(r.v !== 'tour' || r.tab !== 'clock') return;
  const x = tourById(r.id), el = $('clk');
  if(!x || !el || !x.clock) return;
  const k = x.clock, rem = clockDurMs(x, k) - clockEl(k, now);
  el.textContent = fmtMs(rem > 0 ? Math.ceil(rem / 1000) * 1000 : rem);
  el.classList.toggle('warn1', rem > 0 && rem <= 60000);
  el.classList.toggle('over', rem <= 0);
  const st = $('clkst');
  if(st) st.textContent = rem <= 0 ? T().timeUp : k.since ? T().running : k.el ? T().paused : T().ready;
}

function renderImage(title, sub, blocks){
  const W = 1080, PAD = 36, RH = 54, HH = 58, GAP = 22;
  let H = 170;
  blocks.forEach(b => { H += HH + (b.head ? 40 : 0) + b.rows.length * RH + GAP; });

  const fit = (s, w) => { s = String(s); if(cx.measureText(s).width <= w) return s; while(s.length > 1 && cx.measureText(s + '…').width > w) s = s.slice(0, -1); return s + '…'; };

    cx.fillStyle = '#1b5e20'; cx.font = font(900, 28); cx.fillText(fit(b.title, W - 2 * PAD), PAD + 6, y + HH / 2 + 2);
    y += HH;
    const total = b.cols.reduce((s, c) => s + c.w, 0), avail = W - 2 * PAD;
    const xs = []; let acc = PAD;
    b.cols.forEach(c => { xs.push(acc); acc += c.w / total * avail; });
    const cell = (txt, ci, yy, bold, color) => {
      const c = b.cols[ci], w = c.w / total * avail - 12;

      const s = fit(txt, w);

      const xx = c.al === 'r' ? xs[ci] + w + 6 - tw : c.al === 'c' ? xs[ci] + (w + 12 - tw) / 2 : xs[ci] + 6;
      cx.fillText(s, xx, yy);

    if(b.head){ b.head.forEach((h, ci) => cell(h, ci, y + 20, true, '#4f5d54')); y += 40; }
    b.rows.forEach((row, ri) => {
      if(ri % 2 === 0){ cx.fillStyle = '#f2f6f2'; cx.fillRect(PAD - 4, y, W - 2 * PAD + 8, RH); }
      row.forEach((v, ci) => cell(v, ci, y + RH / 2 + 1, b.bold && b.bold.indexOf(ci) !== -1, row.color && ci === 1 ? row.color : null));
      y += RH;
    });

  cx.font = font(600, 20); cx.fillStyle = '#4f5d54'; cx.fillText(T().appName, PAD, H - 26);

      blocks.push({ title: groupName(x, gi), head: ['', t.thTeam, t.thP, c.score === 'sets' ? t.thSets : c.score === 'points' ? t.thScore : t.thGoals, t.thDiff, t.thPts],

        rows: A.tables[gi].map(r => [String(r.pos), tname(x, r.id), String(r.p), c.score === 'sets' ? r.sw + ':' + r.sl : r.gf + ':' + r.ga, (r.diffv > 0 ? '+' : '') + r.diffv, String(r.pts)]) });
    });
    const ko = x.matches.filter(m => m.ph === 'ko');
    if(ko.length) blocks.push({ title: c.mode === 'ko' ? t.bracket : t.finalRound, cols: [{ w: 2.6, size: 22 }, { w: 3.4, al: 'r' }, { w: 1.8, al: 'c' }, { w: 3.4 }], bold: [2],
      rows: ko.slice().sort((a, b) => a.slot - b.slot || a.f - b.f).map(m => [matchLabel(m), sideName(x, m, A, 'h').name, imgScore(x, m, A), sideName(x, m, A, 'a').name]) });
  }
  return blocks;
}

  try {
    const r = await saveBlob(new Blob([JSON.stringify(data)], { type: 'application/json' }), fileName('TurnierPro_Sicherung'), 'application/json');
    if(r === 'abbruch') return;
    DB.lastBackupAt = Date.now(); save();

}
function backupImport(data){
  const t = T();
  if(!data || data.app !== 'turnierpro'){ toast(t.importError); return; }
  let nt = 0, nr = 0;
  (Array.isArray(data.teams) ? data.teams : []).map(cleanTeam).filter(Boolean).forEach(x => { if(!teamById(x.id)){ DB.teams.push(x); nt++; } });
  (Array.isArray(data.tours) ? data.tours : []).map(cleanTour).filter(Boolean).forEach(x => { if(!tourById(x.id)){ DB.tours.push(x); nr++; } });
  if(data.images && typeof data.images === 'object'){
    Object.keys(data.images).forEach(k => {
      const v = data.images[k];
      const okImg = /^([\w-]+:(logo|photo)|cert:(logo|bg))$/.test(k) && /^data:image\/(png|jpeg|webp);base64,/.test(v);
      const okOther = (/^snd:(start|warn|end)$/.test(k) && /^data:audio\/[\w.+-]+;base64,/.test(v)) || (k === 'cert:docx' && /^data:application\/[\w.+-]+;base64,/.test(v));
      if(typeof v === 'string' && (okImg || okOther) && v.length < 9e6 && !IMG[k]) setImg(k, v);
    });
  }
  save(); render(false); toast(t.imported(nt, nr));
}
