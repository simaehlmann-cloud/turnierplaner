# =====================================================================
# TurnierPro - iOS-Build fuer den App Store (iPhone und iPad)
#
# Aufbau nach dem Vorbild von FairMix/.github/workflows/ios.yml.
#
# Was passiert wann:
#   - Jeder Push auf main: baut die App (unsigniert UND signiert) zur
#     Kontrolle. Es wird NICHTS zu Apple hochgeladen.
#   - Manueller Start (Actions -> "Build TurnierPro (iOS)" -> Run workflow):
#     baut und laedt zusaetzlich nach App Store Connect hoch.
#     Jede hochgeladene Build-Nummer ist bei Apple dauerhaft verbraucht -
#     deshalb nur auf Knopfdruck.
#
# Versionen:
#   - Sichtbare Version (2.2.0 ...) = version="..." in config.xml.
#     Muss in App Store Connect bei der Version genauso eingetragen sein.
#   - Build-Nummer = fortlaufende Laufnummer dieses Workflows. Steigt bei
#     jedem Lauf automatisch; von Hand ist nichts zu tun.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   IOS_CERTIFICATE_P12_BASE64   Distributionszertifikat samt Schluessel (.p12, base64)
#   IOS_CERTIFICATE_PASSWORD     Passwort dieser .p12
#   IOS_PROVISIONING_PROFILE     App-Store-Profil fuer de.turnierpro.app (base64)
#   IOS_TEAM_ID                  zehnstellige Team-ID
#   IOS_SIGNING_IDENTITY         "Apple Distribution: <Name> (<Team-ID>)", zeichengenau
#   ASC_KEY_ID                   App-Store-Connect-API: Schluessel-ID
#   ASC_ISSUER_ID                App-Store-Connect-API: Aussteller-ID
#   ASC_KEY_P8                   Inhalt der AuthKey_<ID>.p8, samt BEGIN/END-Zeilen
# =====================================================================

name: Build TurnierPro (iOS)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Festgepinnt statt macos-latest: "latest" wandert ohne Vorwarnung auf
    # eine neue Xcode-Fassung. Apple verlangt seit 28.04.2026 Xcode 26 /
    # iOS-26-SDK; jedes Fruehjahr kommt eine neue Pflichtfassung dazu.
    runs-on: macos-26

    env:
      APP_ID: de.turnierpro.app
      APP_NAME: TurnierPro
      CORDOVA_CLI: '13.0.0'
      CORDOVA_IOS: '8.1.1'
      # Dieselben Plugin-Fassungen, mit denen FairMix im Store laeuft.
      # Sie werden NUR hier eingebunden, nicht in config.xml - so bleibt
      # der Android-Build unberuehrt.
      PLUGIN_TEILEN: 'cordova-plugin-x-socialsharing@6.0.4'
      PLUGIN_STATUSLEISTE: 'cordova-plugin-statusbar@4.0.0'
      # Bildschirm anlassen, solange die Turnieruhr laeuft (idleTimerDisabled)
      PLUGIN_WACH: 'cordova-plugin-insomnia@4.3.0'
      # Signal bei gesperrtem Bildschirm (letzte Minute, Abpfiff)
      PLUGIN_ERINNERUNG: 'cordova-plugin-local-notification@1.2.3'
      # In-App-Kauf "Pro" (StoreKit)
      PLUGIN_KAUF: 'cordova-plugin-purchase@13.18.0'

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Apple nimmt Uploads nur an, wenn sie mit einem hinreichend neuen SDK
      # gebaut wurden. Diese Zeile ist der Ort, an dem das jaehrlich
      # nachgezogen wird (bei FairMix gleichzeitig).
      - name: Xcode auswählen
        run: |
          set -e
          ls /Applications | grep -i '^Xcode' || true
          APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$APP" ] || { echo "::error::Kein Xcode 26 auf diesem Laeufer gefunden."; exit 1; }
          sudo xcode-select -switch "$APP"
          xcodebuild -version

      - name: Icons und Startbild erzeugen
        run: |
          set -e
          python3 -m pip install --quiet --break-system-packages Pillow || pip3 install --quiet Pillow
          python3 tools/make_ios_icons.py

      - name: Cordova installieren
        run: npm install -g "cordova@${CORDOVA_CLI}"

      - name: Cordova-Projekt aufbauen
        run: |
          set -euo pipefail
          cordova create build "$APP_ID" "$APP_NAME"
          cp config.xml build/config.xml

          # Build-Nummer = Laufnummer. Steigt bei jedem Lauf, auch bei
          # abgebrochenen - Luecken sind fuer Apple kein Problem, nur
          # Wiederholungen.
          python3 - "$GITHUB_RUN_NUMBER" <<'PYEOF'
          import re, sys
          nummer = sys.argv[1]
          pfad = 'build/config.xml'
          s = open(pfad, encoding='utf-8').read()
          s = re.sub(r'\s+ios-CFBundleVersion="[^"]*"', '', s)
          neu, n = re.subn(r'<widget ', '<widget ios-CFBundleVersion="%s" ' % nummer, s, count=1)
          if n != 1:
              sys.exit('FEHLER: <widget> nicht gefunden')
          open(pfad, 'w', encoding='utf-8').write(neu)
          print('Build-Nummer gesetzt:', nummer)
          PYEOF

          mkdir -p build/res
          cp -r res/ios build/res/ios

          rm -rf build/www/*
          cp index.html manifest.json sw.js image.png icon_maskable.png build/www/
          cp datenschutz.html impressum.html datenschutz-en.html impressum-en.html build/www/
          # Lokalisierte Texte (App-Name DE/EN); Android liest daraus values-en
          cp -r l10n build/l10n

          echo "--- Kontrolle: was hier steht, landet im Store ---"
          grep -o '<widget[^>]*>' build/config.xml | tr ' ' '\n' | grep -E 'id=|version=|CFBundleVersion'

      - name: CSP pruefen
        run: |
          set -euo pipefail
          if grep -o 'http-equiv="Content-Security-Policy"[^>]*' build/www/index.html | grep -q 'https\?://'; then
            echo "::error::Die CSP in index.html erlaubt externe Hosts."
            exit 1
          fi
          echo "CSP ohne externe Hosts."

      - name: iOS-Plattform und Plugins hinzufügen
        working-directory: build
        run: |
          set -euo pipefail
          cordova platform add "ios@${CORDOVA_IOS}" --no-telemetry
          cordova plugin add "$PLUGIN_TEILEN" --no-telemetry
          cordova plugin add "$PLUGIN_STATUSLEISTE" --no-telemetry
          cordova plugin add "$PLUGIN_WACH" --no-telemetry
          cordova plugin add "$PLUGIN_ERINNERUNG" --no-telemetry
          cordova plugin add "$PLUGIN_KAUF" --no-telemetry
          # Das eigene Teilen-Plugin (plugins/cordova-plugin-tb-share) ist
          # reines Android und wird hier bewusst nicht eingebunden.
          cordova plugin ls
          # Nach dem Hinzufuegen der Plugins neu vorbereiten, damit deren
          # Info.plist-Eintraege VOR unseren edit-config-Texten stehen und
          # von diesen ueberschrieben werden.
          cordova prepare ios --no-telemetry

      # App-Name und Berechtigungstexte zweisprachig: TurnierPro (Deutsch),
      # TourneyPro (Englisch). Scheitert dieser Schritt, baut die App trotzdem -
      # dann nur mit dem deutschen Namen. Die Warnung steht in der Zusammenfassung.
      - name: App-Namen lokalisieren (DE/EN)
        working-directory: build
        run: |
          set -e
          ruby -e "require 'xcodeproj'" 2>/dev/null || sudo gem install xcodeproj --no-document
          # Sicherung des Xcode-Projekts: scheitert der Build mit der
          # Lokalisierung, setzt der Build-Schritt darauf zurueck.
          PBX=$(find platforms/ios -maxdepth 2 -name project.pbxproj -not -path '*/Pods/*' | head -1)
          cp "$PBX" "$PBX.ohne-l10n"
          echo "Projektdatei gesichert: $PBX"
          if ruby ../tools/ios_localize.rb platforms/ios ../l10n/ios; then
            echo "Lokalisierung eingebunden."
          else
            echo "::warning::Lokalisierung des App-Namens fehlgeschlagen - die App heisst ueberall TurnierPro." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Die config.xml erklaert nur die Absicht. Was Xcode wirklich baut,
      # steht in der erzeugten Info.plist - und genau daran scheitert der
      # Upload, wenn es nicht stimmt.
      - name: Erzeugtes Projekt bestätigen
        working-directory: build
        run: |
          set -e
          PLIST=$(find platforms/ios -maxdepth 3 -name '*-Info.plist' | head -1)
          [ -n "$PLIST" ] || { echo "::error::Keine Info.plist im erzeugten Projekt gefunden."; exit 1; }
          echo "--- Info.plist: $PLIST ---"

          holen() {
            /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST" 2>/dev/null || echo "FEHLT"
          }

          # cordova-ios 8 traegt in die Info.plist nur $(PRODUCT_BUNDLE_IDENTIFIER)
          # ein; der Wert steht dann in der Projektdatei.
          BUNDLE=$(holen CFBundleIdentifier)
          case "$BUNDLE" in
            FEHLT|*'$('*)
              PBX=$(find platforms/ios -name project.pbxproj | head -1)
              if [ -n "$PBX" ]; then
                BUNDLE=$(grep -m1 -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*;' "$PBX" \
                         | sed 's/.*= *//; s/;$//; s/^"//; s/"$//')
              fi
              [ -n "$BUNDLE" ] || BUNDLE=FEHLT
              ;;
          esac
          VERSION=$(holen CFBundleShortVersionString)
          BUILDNR=$(holen CFBundleVersion)
          case "$VERSION" in *'$('*) VERSION=$(grep -m1 -o 'MARKETING_VERSION = [^;]*;' $(find platforms/ios -name project.pbxproj | head -1) | sed 's/.*= *//; s/;$//');; esac
          case "$BUILDNR" in *'$('*) BUILDNR=$(grep -m1 -o 'CURRENT_PROJECT_VERSION = [^;]*;' $(find platforms/ios -name project.pbxproj | head -1) | sed 's/.*= *//; s/;$//');; esac
          KRYPTO=$(holen ITSAppUsesNonExemptEncryption)
          FOTOS=$(holen NSPhotoLibraryAddUsageDescription)
          FOTOS_LESEN=$(holen NSPhotoLibraryUsageDescription)
          KAMERA=$(holen NSCameraUsageDescription)
          GERAETE=$(grep -m1 -o 'TARGETED_DEVICE_FAMILY = [^;]*;' $(find platforms/ios -name project.pbxproj | head -1) | sed 's/.*= *//; s/;$//; s/"//g')

          echo "Bundle-ID:        $BUNDLE"
          echo "Version:          $VERSION"
          echo "Build-Nummer:     $BUILDNR"
          echo "Geraete:          $GERAETE   (1 = iPhone, 2 = iPad)"
          echo "Export-Erklärung: $KRYPTO"
          echo "Foto-Hinweis:     $FOTOS"
          echo "Foto-Lesen-Text:  $FOTOS_LESEN"
          echo "Kamera-Text:      $KAMERA"

          FEHLER=0
          [ "$BUNDLE" = "$APP_ID" ] || { echo "::error::Bundle-ID ist '$BUNDLE', erwartet '$APP_ID'."; FEHLER=1; }
          [ "$KRYPTO" = "false" ]  || { echo "::error::ITSAppUsesNonExemptEncryption fehlt."; FEHLER=1; }
          [ "$FOTOS" != "FEHLT" ]  || { echo "::error::NSPhotoLibraryAddUsageDescription fehlt - 'Bild sichern' beendet die App."; FEHLER=1; }
          [ "$KAMERA" != "FEHLT" ] || { echo "::error::NSCameraUsageDescription fehlt - 'Foto aufnehmen' beendet die App."; FEHLER=1; }
          [ "$FOTOS_LESEN" != "FEHLT" ] || { echo "::error::NSPhotoLibraryUsageDescription fehlt."; FEHLER=1; }
          case "$FOTOS_LESEN" in
            *"requires photo library access"*) echo "::error::Platzhaltertext des Plugins in NSPhotoLibraryUsageDescription - Apple weist das ab."; FEHLER=1;;
          esac
          case "$GERAETE" in
            *2*) ;;
            *) echo "::error::Die App ist nicht fuer das iPad freigegeben (TARGETED_DEVICE_FAMILY=$GERAETE)."; FEHLER=1;;
          esac

          # cordova-ios 8 legt selbst ein PrivacyInfo.xcprivacy an, aber mit
          # leerem NSPrivacyAccessedAPITypes. Unseres ersetzt es an Ort und
          # Stelle - zwei Manifeste waeren mehrdeutig.
          MANIFESTE=$(find platforms/ios -name PrivacyInfo.xcprivacy -not -path '*/Pods/*' | wc -l | tr -d ' ')
          echo "Privacy-Manifeste im Projekt: $MANIFESTE"
          if [ "$MANIFESTE" -eq 0 ]; then
            echo "::error::Kein PrivacyInfo.xcprivacy im Projekt."
            FEHLER=1
          else
            for M in $(find platforms/ios -name PrivacyInfo.xcprivacy -not -path '*/Pods/*'); do
              case "$M" in *cordova-plugin-*) continue;; esac
              if ! grep -q 'CA92.1' "$M"; then
                echo "Ersetze mitgeliefertes Manifest: $M"
                cp ../tools/PrivacyInfo.xcprivacy "$M"
              fi
            done
          fi

          exit $FEHLER

      # Ohne Zertifikat laeuft trotzdem ein Build - er beweist, dass das
      # Projekt uebersetzt. Nur hochladen laesst er sich nicht.
      - name: Unsigniert bauen (Kompilierbarkeit nachweisen)
        working-directory: build
        run: |
          set -o pipefail
          # Xcode-Fehler als Meldungen am Lauf ausgeben: die stehen dann oben
          # in der Zusammenfassung, ohne dass man das lange Log durchsuchen muss.
          fehler_melden() {
            grep -E "error:|\*\* BUILD FAILED|xcodebuild: error|Multiple commands produce|CordovaError" "$1" \
              | sed 's/^[[:space:]]*//' | sort -u | head -n 25 \
              | while IFS= read -r z; do echo "::error::${z:0:400}"; done
            { echo "### Xcode-Fehler"; echo '```'; grep -E "error:|BUILD FAILED|Multiple commands produce" "$1" | sort -u | head -n 40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          }
          # compile statt build: build wuerde vorher erneut "prepare" ausfuehren und dabei
          # die eben eingebundenen Sprachordner (de.lproj/en.lproj) wieder entfernen.
          # Sprachdateien direkt vor dem Kompilieren an die Stelle legen, an der
          # das Xcode-Projekt sie erwartet (neben der Info.plist).
          INFO=$(find platforms/ios -maxdepth 3 -name '*-Info.plist' -not -path '*/Pods/*' | head -1)
          RES=$(dirname "$INFO")
          for L in de en; do mkdir -p "$RES/$L.lproj" && cp ../l10n/ios/$L.lproj/InfoPlist.strings "$RES/$L.lproj/"; done
          echo "::notice::Sprachdateien in $RES: $(ls -d "$RES"/*.lproj 2>/dev/null | xargs -n1 basename | tr '\n' ' ')"
          grep -o '[a-z]*\.lproj/InfoPlist.strings' "$(find platforms/ios -maxdepth 2 -name project.pbxproj | head -1)" | sort -u | tr '\n' ' ' | sed 's/^/::notice::Im Projekt eingetragen: /'; echo
          if cordova compile ios --debug --emulator --no-telemetry 2>&1 | tee build_log.txt; then
            echo "Build mit Lokalisierung erfolgreich."
          else
            fehler_melden build_log.txt
            PBX=$(find platforms/ios -maxdepth 2 -name project.pbxproj -not -path '*/Pods/*' | head -1)
            if [ -f "$PBX.ohne-l10n" ]; then
              echo "::warning::Build mit Lokalisierung fehlgeschlagen - zweiter Versuch ohne (App-Name dann nur TurnierPro)." | tee -a "$GITHUB_STEP_SUMMARY"
              cp "$PBX.ohne-l10n" "$PBX"
              rm -rf platforms/ios/build
              cordova compile ios --debug --emulator --no-telemetry 2>&1 | tee build_log2.txt || { fehler_melden build_log2.txt; exit 1; }
            else
              exit 1
            fi
          fi
          # Kontrolle: sind die Sprachordner wirklich im fertigen App-Paket?
          APP=$(find platforms/ios/build -name '*.app' -type d 2>/dev/null | head -1)
          echo "App-Paket: $APP"
          for L in de en; do
            if [ -n "$APP" ] && [ -f "$APP/$L.lproj/InfoPlist.strings" ]; then
              echo "  ok  $L.lproj/InfoPlist.strings"
            else
              echo "::warning::$L.lproj/InfoPlist.strings fehlt im App-Paket - App-Name nicht lokalisiert." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done

      # ---- Signierter Build für den App Store ----
      - name: Signierschlüssel einrichten
        id: signieren
        env:
          ZERT_B64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          ZERT_PW: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFIL_B64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -e
          if [ -z "$ZERT_B64" ] || [ -z "$PROFIL_B64" ]; then
            echo "vorhanden=false" >> "$GITHUB_OUTPUT"
            echo "Kein Zertifikat hinterlegt – signierter Build wird übersprungen."
            exit 0
          fi

          # Unsichtbare Zeichen entfernen, die beim Kopieren mitkommen koennen.
          saeubern() {
            printf '%s' "$1" | sed '1s/^\xEF\xBB\xBF//' | tr -d ' \t\r\n' | base64 -d
          }

          ZERT="$RUNNER_TEMP/dist.p12"
          PROFIL="$RUNNER_TEMP/profil.mobileprovision"
          saeubern "$ZERT_B64"   > "$ZERT"
          saeubern "$PROFIL_B64" > "$PROFIL"
          [ -s "$ZERT" ]   || { echo "::error::Das Zertifikat ließ sich nicht dekodieren."; exit 1; }
          [ -s "$PROFIL" ] || { echo "::error::Das Profil ließ sich nicht dekodieren."; exit 1; }

          # Pruefen, dass das Profil wirklich zu TurnierPro gehoert - ein
          # versehentlich eingefuegtes FairMix-Profil faellt sonst erst beim
          # Signieren mit einer unverstaendlichen Meldung auf.
          PROFIL_PLIST="$RUNNER_TEMP/profil.plist"
          security cms -D -i "$PROFIL" > "$PROFIL_PLIST"
          PROFIL_APP=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFIL_PLIST")
          PROFIL_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFIL_PLIST")
          PROFIL_ENDE=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$PROFIL_PLIST")
          echo "Profil: $PROFIL_NAME  ($PROFIL_APP), gültig bis $PROFIL_ENDE"
          case "$PROFIL_APP" in
            *".$APP_ID") ;;
            *) echo "::error::Das Profil gehört zu '$PROFIL_APP', nicht zu $APP_ID. Secret IOS_PROVISIONING_PROFILE prüfen."; exit 1;;
          esac

          BUND="$RUNNER_TEMP/signieren.keychain-db"
          BUND_PW=$(uuidgen)
          security create-keychain -p "$BUND_PW" "$BUND"
          security set-keychain-settings -lut 21600 "$BUND"
          security unlock-keychain -p "$BUND_PW" "$BUND"
          security import "$ZERT" -P "$ZERT_PW" -A -t cert -f pkcs12 -k "$BUND" \
            || { echo "::error::Zertifikat-Import fehlgeschlagen. Stimmt IOS_CERTIFICATE_PASSWORD?"; exit 1; }
          security set-key-partition-list -S apple-tool:,apple: -k "$BUND_PW" "$BUND" > /dev/null
          security list-keychain -d user -s "$BUND" login.keychain-db

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFIL_PLIST")
          cp "$PROFIL" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "Profil installiert: $UUID"

          rm -f "$ZERT" "$PROFIL" "$PROFIL_PLIST"
          echo "profil_uuid=$UUID" >> "$GITHUB_OUTPUT"
          echo "vorhanden=true" >> "$GITHUB_OUTPUT"

      - name: Signiert bauen (IPA für den App Store)
        if: steps.signieren.outputs.vorhanden == 'true'
        working-directory: build
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IDENTITAET: ${{ secrets.IOS_SIGNING_IDENTITY }}
          PROFIL_UUID: ${{ steps.signieren.outputs.profil_uuid }}
        run: |
          set -euo pipefail
          # jq escaped die Werte korrekt (Umlaut im Namen, Doppelpunkt, Klammern).
          jq -n \
            --arg id "$IDENTITAET" --arg team "$TEAM_ID" --arg profil "$PROFIL_UUID" \
            '{ios:{release:{codeSignIdentity:$id, developmentTeam:$team, provisioningProfile:$profil, packageType:"app-store", automaticProvisioning:false}}}' \
            > build.json
          cordova compile ios --release --device --buildConfig=build.json --no-telemetry
          rm -f build.json

      - name: IPA hochladen (Artefakt)
        if: steps.signieren.outputs.vorhanden == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: TurnierPro-ios-ipa
          path: build/platforms/ios/build/**/*.ipa
          if-no-files-found: error

      # ---- Upload nach App Store Connect (nur bei manuellem Start) ----
      - name: In App Store Connect hochladen
        if: steps.signieren.outputs.vorhanden == 'true' && github.event_name == 'workflow_dispatch'
        working-directory: build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -e
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::Keine App-Store-Connect-Schlüssel hinterlegt – Upload übersprungen. Die IPA liegt als Artefakt bereit."
            exit 0
          fi

          # altool sucht den Schluessel genau hier, unter genau diesem Namen.
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          IPA=$(find platforms/ios/build -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "::error::Keine IPA gefunden."; exit 1; }
          echo "Lade hoch: $IPA"

          # Erst pruefen, dann senden: der Pruefschritt findet Fehler, bevor
          # eine Build-Nummer verbraucht ist.
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

          rm -f "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "Hochgeladen. Die Verarbeitung in App Store Connect dauert 5–30 Minuten." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Schlüsselbund entfernen
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signieren.keychain-db" 2>/dev/null || true
